/* =====================================================
 * 七十二、顶栏
 * ===================================================== */
function renderTopbar() {
  const p = G.player;

  /* 家族印章：姓氏 */
  const surname = p.name ? p.name[0] : '仙';
  const sealIcon = document.getElementById('sealIcon');
  const sealName = document.getElementById('sealName');
  if (sealIcon) sealIcon.textContent = surname;
  if (sealName) sealName.textContent = surname + '氏';

  /* 数据格 */
  const stats = document.getElementById('statCells');
  if (!stats) return;

  /* 声望等级 */
  const rep = G.reputation || 0;
  let repTitle = '无名小卒';
  if (rep >= 100000) repTitle = '天下共主';
  else if (rep >= 50000) repTitle = '一代仙宗';
  else if (rep >= 20000) repTitle = '名动四方';
  else if (rep >= 10000) repTitle = '一方豪强';
  else if (rep >= 3000) repTitle = '小有名气';
  else if (rep >= 1000) repTitle = '初露锋芒';
  else if (rep >= 300) repTitle = '略有薄名';
  else if (rep >= 100) repTitle = '新起之秀';

  stats.innerHTML = `
    <div class="stat-cell">
      <div class="stat-val">${fmt(G.stone || 0)}</div>
      <div class="stat-lbl">灵石</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val">${(G.family || []).length + 1}</div>
      <div class="stat-lbl">族人</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val">${G.generation || 1}</div>
      <div class="stat-lbl">世代</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val">${G.year || 1}</div>
      <div class="stat-lbl">年份</div>
    </div>
    <div class="stat-cell" style="min-width:82px">
      <div class="stat-val" style="font-size:11.5px">${fmt(rep)}</div>
      <div class="stat-lbl">${repTitle}</div>
    </div>
  `;

  /* 一级 Tab */
  renderTabRow();
}

/* 一级 Tab 行 */
const TABS = [
  { id: 'family',    n: '家事' },
  { id: 'cultivate', n: '藏宝' },
  { id: 'manage',    n: '家业' },
  { id: 'world',     n: '天下' },
  { id: 'legacy',    n: '族谱' }
];

const SUBTABS = {
  family:    [
    { id: 'home',     n: '家主页' },
    { id: 'members',  n: '族人' },
    { id: 'spouses',  n: '道侣' },
    { id: 'tree',     n: '族谱' },
    { id: 'cemetery', n: '先人' },
    { id: 'titles',   n: '功名' }
  ],
  cultivate: [
    { id: 'tech',      n: '功法' },
    { id: 'pill',      n: '丹药' },
    { id: 'plant',     n: '灵植' },
    { id: 'beast',     n: '灵兽' },
    { id: 'formation', n: '阵法' }
  ],
  manage:    [
    { id: 'build', n: '基建' },
    { id: 'sect',  n: '宗门' },
    { id: 'rule',  n: '家训' }
  ],
  world:     [
    { id: 'faction', n: '势力' },
    { id: 'war',     n: '战报' },
    { id: 'quest',   n: '天命' },
    { id: 'history', n: '史册' }
  ],
  legacy:    [
    { id: 'legacy',   n: '底蕴' },
    { id: 'settings', n: '设置' }
  ]
};

function renderTabRow() {
  const row = document.getElementById('tabRow');
  if (!row) return;
  row.innerHTML = TABS.map(t =>
    `<button class="tab-btn ${UI.tab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.n}</button>`
  ).join('');

  row.querySelectorAll('[data-tab]').forEach(btn => {
    btn.onclick = () => {
      if (UI.modalOpen) return;
      UI.tab = btn.dataset.tab;
      UI.sub = SUBTABS[UI.tab][0].id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    };
  });
}

/* =====================================================
 * 七十三、主内容区
 * ===================================================== */
function renderMainContent() {
  const subs = SUBTABS[UI.tab] || [];
  if (!subs.some(s => s.id === UI.sub)) UI.sub = subs[0].id;

  let html = '';

  /* 二级 Tab */
  if (subs.length > 1) {
    html += `<div class="sub-tabs">`;
    html += subs.map(s =>
      `<button class="sub-tab ${UI.sub === s.id ? 'active' : ''}" data-sub="${s.id}">${s.n}</button>`
    ).join('');
    html += `</div>`;
  }

  /* 内容区 */
  html += `<div id="pageBody"></div>`;

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('[data-sub]').forEach(btn => {
    btn.onclick = () => {
      if (UI.modalOpen) return;
      UI.sub = btn.dataset.sub;
      render();
    };
  });

  document.getElementById('pageBody').innerHTML = renderPage();
  bindPageEvents();
}

function renderPage() {
  switch (UI.tab) {
    case 'family':
      if (UI.sub === 'home')     return renderFamilyHome();
      if (UI.sub === 'members')  return renderMembers();
      if (UI.sub === 'spouses')  return renderSpouses();
      if (UI.sub === 'tree')     return renderTree();
      if (UI.sub === 'cemetery') return renderCemetery();
      if (UI.sub === 'titles')   return renderTitles();
      break;
    case 'cultivate':
      if (UI.sub === 'tech')      return renderTech();
      if (UI.sub === 'pill')      return renderPill();
      if (UI.sub === 'plant')     return renderPlant();
      if (UI.sub === 'beast')     return renderBeast();
      if (UI.sub === 'formation') return renderFormation();
      break;
    case 'manage':
      if (UI.sub === 'build') return renderBuild();
      if (UI.sub === 'sect')  return renderSect();
      if (UI.sub === 'rule')  return renderRule();
      break;
    case 'world':
      if (UI.sub === 'faction') return renderFaction();
      if (UI.sub === 'war')     return renderWar();
      if (UI.sub === 'quest')   return renderQuest();
      if (UI.sub === 'history') return renderHistory();
      break;
    case 'legacy':
      if (UI.sub === 'legacy')   return renderLegacy();
      if (UI.sub === 'settings') return renderSettings();
      break;
  }
  return '<div class="empty">未知页面</div>';
}

/* =====================================================
 * 七十四、悬浮按钮
 * ===================================================== */
function renderFab() {
  const fab = document.getElementById('fab');
  if (!fab) return;
  const y = UI.selectedYears || 5;
  fab.innerHTML = `度 岁<span class="fab-years">${y}年</span>`;
  fab.disabled = !!G.over;
}

/* =====================================================
 * 七十五、家主页（含领地场景）
 * ===================================================== */
function renderFamilyHome() {
  const p = G.player;
  const bd = breakRateDetail(p);
  const need = expNeed(p);
  const expPct = Math.min(100, (p.exp / need) * 100);
  const bl = getBL(p);
  const per = getPer(p);

  /* 领地场景中的建筑等级 */
  const shrineLv = Math.min(6, 1 + Math.floor(p.realm / 2));
  const alchemyLv = Math.min(6, 1 + (G.buildings.pill || 0));
  const fieldLv = Math.min(6, 1 + (G.buildings.farm || 0));
  const gateLv = G.isSect ? Math.min(6, 1 + G.sectLevel) : Math.min(2, 1 + Math.floor(p.realm / 3));

  /* 建筑位置 */
  const buildingsHtml = `
    <div class="estate-building b-md" style="left:22%;top:22%" data-goto="shrine">
      ${shrineSvg(shrineLv)}
      <div class="bldg-wrap">
        <div class="bldg-label">宗祠</div>
      </div>
    </div>
    <div class="estate-building b-md" style="left:78%;top:22%" data-goto="alchemy">
      ${alchemySvg(alchemyLv)}
      <div class="bldg-wrap">
        <div class="bldg-label">丹房</div>
      </div>
    </div>
    <div class="estate-building b-md" style="left:22%;top:66%" data-goto="field">
      ${fieldSvg(fieldLv)}
      <div class="bldg-wrap">
        <div class="bldg-label">灵田</div>
      </div>
    </div>
    <div class="estate-building b-md" style="left:78%;top:66%" data-goto="gate">
      ${gateSvg(gateLv)}
      <div class="bldg-wrap">
        <div class="bldg-label">山门</div>
      </div>
    </div>
  `;

  /* 领地提示文字 */
  const hour = G.year % 4;
  let estateTip = '';
  if (p.health) estateTip = `家主身体抱恙，宜静养。`;
  else if (p.exp >= need) estateTip = `家主修为圆满，可闭关冲关。`;
  else if (p.exp / need >= 0.7) estateTip = `早课时间，族人正在修炼。`;
  else estateTip = '山中清静，灵气萦绕。';

  /* 年度大事（取最新 1 条）*/
  const lastDecision = G.pendingEvents && G.pendingEvents.length
    ? G.pendingEvents[0] : null;

  /* 最近记事（前 5 条） */
  const recentLogs = G.log.slice().reverse().slice(0, 5);

  return `
    <div class="estate-scene">
      ${buildEstateBackground()}
      <div class="estate-buildings">${buildingsHtml}</div>
      <div class="estate-info">
        <span class="ei-icon">${icon('scroll', 14)}</span>
        <span class="ei-text">${estateTip}</span>
      </div>
    </div>

    <div class="hero-card">
      <div class="hl">
        <span class="hc-name">${p.name}</span>
        <span class="rk ${REALM_RK[p.realm]}">${realmLabel(p)}</span>
        <span class="chip ${rootClass(p.root)}">${rootLabel(p.root)}</span>
        <span class="chip chip-gold">${bl.n}</span>
        <span class="chip">${per.n}</span>
      </div>
      <div class="bar">
        <div class="bar-fill ${expPct >= 100 ? 'gold' : ''}" style="width:${expPct.toFixed(1)}%"></div>
      </div>
      <div class="hc-rows">
        <div class="row">
          <span>修为 <b>${fmt(p.exp)} / ${fmt(need)}</b></span>
          <span>寿元 <b>${p.age} / ${lifeMax(p)}</b></span>
        </div>
        <div class="row">
          <span>天赋 <b>${p.talent.toFixed(2)}</b></span>
          <span>战力 <b>${fmt(power(p))}</b></span>
        </div>
        ${expPct >= 100 ? `
          <div class="row">
            <span>突破率 <b>${(bd.final * 100).toFixed(1)}%</b></span>
            ${isBigBreakthrough(p) ? '<span class="bad">⚠ 大境界需渡天劫</span>' : ''}
          </div>
        ` : `
          <div class="row dimmer small">
            约 ${Math.ceil((need - p.exp) / Math.max(1, Math.floor(expGain(p) * 5)))} 年后修满
          </div>
        `}
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 年度行动</h3>
        <span class="hint">选行动 → 点右下角「度岁」</span>
      </div>
      <div class="grid-3" style="margin-bottom:8px">
        ${Object.keys(ACTION_DEFS).filter(k => ACTION_DEFS[k].g === 'cultivate').map(k =>
          `<button class="btn ${UI.selectedAction === k ? 'sel' : ''}" data-act="${k}">${ACTION_DEFS[k].n}</button>`
        ).join('')}
      </div>
      <div class="grid-3" style="margin-bottom:8px">
        ${Object.keys(ACTION_DEFS).filter(k => ACTION_DEFS[k].g === 'craft').map(k =>
          `<button class="btn ${UI.selectedAction === k ? 'sel' : ''}" data-act="${k}">${ACTION_DEFS[k].n}</button>`
        ).join('')}
      </div>
      <div class="grid-3">
        ${Object.keys(ACTION_DEFS).filter(k => ACTION_DEFS[k].g === 'world').map(k =>
          `<button class="btn ${UI.selectedAction === k ? 'sel' : ''}" data-act="${k}">${ACTION_DEFS[k].n}</button>`
        ).join('')}
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-2)">
        <span class="dimmer small">年数</span>
        ${[1, 3, 5, 10, 20].map(n =>
          `<button class="btn tiny ${UI.selectedYears === n ? 'sel' : ''}" data-y="${n}">${n}年</button>`
        ).join('')}
      </div>
    </div>

    ${G.secretRealms && G.secretRealms.length ? `
      <div class="card">
        <div class="card-head">
          <h3>${icon('scroll', 14)} 可探秘境</h3>
          <span class="hint">点击进入</span>
        </div>
        ${G.secretRealms.slice(0, 5).map(r => {
          const locked = p.realm < r.minRealm;
          return `
            <div class="mc ${locked ? 'locked' : ''}" data-realm="${r.id}">
              <div class="mc-title">
                <span>${r.name}${locked ? ` <span class="dimmer small">需${REALMS[r.minRealm].n}</span>` : ''}</span>
                <span class="dimmer small">凶险 ${(r.danger * 100).toFixed(0)}%</span>
              </div>
              <div class="mc-desc">灵石 ${fmt(r.stone[0])}-${fmt(r.stone[1])} · 修为 ${fmt(r.exp[0])}-${fmt(r.exp[1])}</div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}

    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 家族记事</h3>
        <span class="hint">近 ${recentLogs.length} 条</span>
      </div>
      <div class="logs">
        ${recentLogs.length ? recentLogs.map(l => `
          <div class="log-l ${l.c}">
            <span class="log-year">【第${l.y}年】</span>${l.t}
          </div>
        `).join('') : '<div class="dimmer small center">尚无记事</div>'}
      </div>
    </div>
  `;
}
</script>
<script>
/* =====================================================
 * 七十六、族人列表
 * ===================================================== */
function renderMembers() {
  const map = new Map(G.family.map(x => [x.id, x]));
  map.set(G.player.id, G.player);

  const sorted = G.family.slice().sort((a, b) => {
    const la = a.realm * 3 + a.sub;
    const lb = b.realm * 3 + b.sub;
    return lb - la || b.age - a.age;
  });

  const allMembers = [G.player].concat(sorted);

  const rows = allMembers.map(p => {
    const lm = lifeMax(p);
    const lifePct = Math.max(0, Math.min(100, (1 - p.age / lm) * 100));
    const isHead = p.isPlayer;
    const genderIcon = p.gender === 'M' ? '乾' : '坤';
    const rank = personRank(p);
    const bl = getBL(p);
    const per = getPer(p);
    const healthTag = p.health === 'injured' ? '<span class="chip chip-cinnabar">伤</span>'
                    : p.health === 'sick' ? '<span class="chip chip-cinnabar">病</span>'
                    : '';

    return `
      <div class="list-item clickable" data-person="${p.id}">
        <div class="li-title">
          <span class="li-name ${isHead ? 'self' : ''}">${p.name}</span>
          <span class="rk ${REALM_RK[p.realm]}">${realmLabel(p)}</span>
          <span class="chip chip-${p.gender === 'M' ? 'jade' : 'gold'}">${genderIcon}</span>
          ${rank !== '外门弟子' && rank !== '家主' ? `<span class="chip">${rank}</span>` : ''}
          ${isHead ? '<span class="chip chip-cinnabar">家主</span>' : ''}
          ${healthTag}
        </div>
        <div class="bar" style="height:5px">
          <div class="bar-fill good" style="width:${lifePct.toFixed(1)}%"></div>
        </div>
        <div class="li-row2">
          <span>寿 ${p.age}/${lm}</span>
          <span class="${rootClass(p.root)}">${rootLabel(p.root)}</span>
          <span>天赋 ${p.talent.toFixed(2)}</span>
        </div>
      </div>
    `;
  }).join('');

  /* 统计 */
  const stats = {};
  allMembers.forEach(p => {
    const k = REALMS[p.realm].n;
    stats[k] = (stats[k] || 0) + 1;
  });
  const statLine = Object.keys(stats).map(k => `${k} ${stats[k]}`).join(' · ');

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 族人</h3>
        <span class="hint">共 ${allMembers.length} 人 · 先人 ${(G.cemetery || []).length}</span>
      </div>
      <div class="sub-tabs" style="margin-bottom:8px">
        <button class="sub-tab active">尊卑</button>
        <button class="sub-tab">境界</button>
        <button class="sub-tab">灵根</button>
        <button class="sub-tab">寿元</button>
      </div>
      ${rows}
      <div class="dimmer small mt10" style="padding:6px;border-top:1px solid var(--border-2);line-height:1.7">
        ${statLine}　·　在世 ${allMembers.length} / 陨落 ${(G.cemetery || []).length}
      </div>
    </div>
  `;
}

/* 计算族人在宗门中的职位 */
function personRank(p) {
  if (p.isPlayer) return '家主';
  if (!G.isSect) {
    if (p.realm >= 4) return '长老';
    if (p.realm >= 2) return '族人';
    return '族中子弟';
  }
  const r = calcSectRank(p);
  return r.n;
}

/* =====================================================
 * 七十七、道侣页面
 * ===================================================== */
function renderSpouses() {
  const p = G.player;
  const spouses = (p.spouseIds || []).map(id => getP(id)).filter(Boolean);

  if (!spouses.length) {
    return `
      <div class="card">
        <div class="card-head"><h3>${icon('scroll', 14)} 道侣</h3></div>
        <div class="empty">
          <div class="em-title">独身一人</div>
          可通过「红尘寻缘」结识道侣，或通过「联姻邀约」事件<br>
          <span class="dimmer2 small">家主可有多位道侣，其他族人限一位</span>
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 道侣</h3>
        <span class="hint">共 ${spouses.length} 位</span>
      </div>
      ${spouses.map(sp => {
        const lm = lifeMax(sp);
        const need = expNeed(sp);
        const kids = G.family.filter(x =>
          x.fatherId === sp.id || x.motherId === sp.id);
        const bl = getBL(sp);
        const per = getPer(sp);

        return `
          <div class="list-item">
            <div class="li-title">
              <span class="li-name">${sp.name}</span>
              <span class="rk ${REALM_RK[sp.realm]}">${realmLabel(sp)}</span>
              <span class="chip chip-gold">正妻</span>
            </div>
            <div class="li-row2">
              <span>寿 ${sp.age}/${lm}</span>
              <span class="${rootClass(sp.root)}">${rootLabel(sp.root)}</span>
              <span>天赋 ${sp.talent.toFixed(2)}</span>
            </div>
            <div class="li-row2">
              <span>${bl.n}</span>
              <span>${per.n}</span>
              <span>子嗣 ${kids.length}</span>
            </div>
            ${kids.length ? `
              <div class="li-row3">
                <span class="dimmer">子嗣：</span>
                ${kids.slice(0, 6).map(k => `<span class="chip">${k.name}</span>`).join('')}
                ${kids.length > 6 ? '<span class="dimmer2">…</span>' : ''}
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* =====================================================
 * 七十八、族谱树
 * ===================================================== */
function renderTree() {
  const all = G.family.concat([G.player]);
  const map = new Map(all.map(x => [x.id, x]));

  /* 找最早的先祖（无父无母的） */
  const roots = all.filter(p => !p.fatherId && !p.motherId);

  function nodeHtml(node, depth) {
    if (depth > 6) return '';
    const children = all.filter(p =>
      p.fatherId === node.id || p.motherId === node.id);
    const sps = (node.spouseIds || []).map(id => map.get(id)).filter(Boolean);
    const isPlayer = node.id === G.player.id;

    let h = `
      <div class="tn ${depth === 0 ? 'root' : ''}">
        <div class="tl">
          <span class="li-name ${isPlayer ? 'self' : ''}">${node.name}</span>
          <span class="rk ${REALM_RK[node.realm]}">${realmLabel(node)}</span>
          ${sps.length ? `<span class="dimmer small">配：${sps.map(s => s.name).join('、')}</span>` : ''}
        </div>
    `;
    if (children.length) {
      h += children.map(c => nodeHtml(c, depth + 1)).join('');
    }
    h += '</div>';
    return h;
  }

  if (!roots.length) {
    return `
      <div class="card">
        <div class="card-head"><h3>${icon('scroll', 14)} 族谱</h3></div>
        <div class="empty">尚无族谱记载</div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 族谱</h3>
        <span class="hint">共 ${all.length} 人</span>
      </div>
      <div class="tree">${roots.map(r => nodeHtml(r, 0)).join('')}</div>
    </div>
  `;
}

/* =====================================================
 * 七十九、墓园
 * ===================================================== */
function renderCemetery() {
  if (!(G.cemetery || []).length) {
    return `
      <div class="card">
        <div class="card-head"><h3>${icon('scroll', 14)} 墓园</h3></div>
        <div class="empty">
          <div class="em-title">墓园空荡</div>
          家族元婴以上族人逝去后入墓园<br>
          <span class="dimmer2 small">每多一位先人，祖荫加成提升</span>
        </div>
      </div>
    `;
  }

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 墓园</h3>
        <span class="hint">祖荫 +${G.cemeteryBonus || 0}%</span>
      </div>
      ${G.cemetery.slice().reverse().map(c => `
        <div class="list-item">
          <div class="li-title">
            <span class="li-name">${c.n}</span>
            <span class="rk ${REALM_RK[c.realm]}">${REALMS[c.realm].n}</span>
            <span class="chip chip-gold">第${c.gen || 1}代</span>
          </div>
          <div class="li-row2">
            <span>享年 ${c.age}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

/* =====================================================
 * 八十、称号
 * ===================================================== */
function renderTitles() {
  const owned = G.titles || [];
  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 功名</h3>
        <span class="hint">${owned.length}/${TITLES.length}</span>
      </div>
      ${TITLES.map(t => {
        const has = owned.includes(t.id);
        return `
          <div class="list-item" style="${has ? '' : 'opacity:0.5'}">
            <div class="li-title">
              <span class="li-name" style="${has ? 'color:var(--gold)' : ''}">
                ${has ? '🏅 ' : '🔒 '}${t.n}
              </span>
            </div>
            <div class="li-row2 dimmer small">${t.d}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}
</script>
<script>
/* =====================================================
 * 八十一、功法页面
 * ===================================================== */
function renderTech() {
  const unlocked = (G.techniqueIds || []).map(id =>
    TECHNIQUES.find(t => t.id === id)).filter(Boolean);

  /* 按系别分组 */
  const bySchool = {};
  for (const t of unlocked) {
    if (!bySchool[t.s]) bySchool[t.s] = [];
    bySchool[t.s].push(t);
  }

  /* 玩家已学 */
  const playerLearned = (G.player.techniques || []).map(id =>
    TECHNIQUES.find(t => t.id === id)).filter(Boolean);

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 藏经阁</h3>
        <span class="hint">Lv.${G.buildings.library || 0} · 已录 ${unlocked.length} 门</span>
      </div>

      ${playerLearned.length ? `
        <div class="section-divider">家主所修</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
          ${playerLearned.map(t => `
            <span class="chip chip-jade">
              ${schoolIcon(t.s)} ${t.n}
            </span>
          `).join('')}
        </div>
      ` : ''}

      ${!unlocked.length
        ? '<div class="empty">尚未收录功法，升级藏经阁可解锁</div>'
        : Object.keys(bySchool).map(s => `
            <div class="section-divider">${SCHOOL_NAMES[s] || s}系</div>
            ${bySchool[s].map(t => {
              const learned = (G.player.techniques || []).includes(t.id);
              return `
                <div class="list-item" style="border-left:3px solid ${
                  t.t >= 4 ? 'var(--cinnabar)' :
                  t.t >= 3 ? '#7a4a99' :
                  t.t >= 2 ? 'var(--azure)' : 'var(--jade)'
                }">
                  <div class="li-title">
                    <span>${schoolIcon(t.s)}</span>
                    <span class="li-name">${t.n}</span>
                    <span class="chip">${t.t}阶</span>
                    ${learned ? '<span class="chip chip-jade">已修</span>' : ''}
                  </div>
                  <div class="li-row2 dimmer small">${t.d}</div>
                </div>
              `;
            }).join('')}
          `).join('')}
    </div>
  `;
}

/* =====================================================
 * 八十二、丹药页面
 * ===================================================== */
function renderPill() {
  const recipes = (G.pillRecipes || [])
    .map(id => PILLS.find(p => p.id === id))
    .filter(Boolean)
    .sort((a, b) => a.t - b.t);

  /* 库存 */
  const inventory = Object.keys(G.pills || {})
    .filter(id => G.pills[id] > 0)
    .map(id => ({ pill: PILLS.find(p => p.id === id), count: G.pills[id] }))
    .filter(i => i.pill)
    .sort((a, b) => a.pill.t - b.pill.t);

  /* 按品阶分组丹方 */
  const byTier = {};
  for (const p of recipes) {
    if (!byTier[p.t]) byTier[p.t] = [];
    byTier[p.t].push(p);
  }

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('cauldron', 14)} 丹药阁</h3>
        <span class="hint">丹房 Lv.${G.buildings.pill || 0}</span>
      </div>

      <div class="section-divider">库存</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${inventory.length
          ? inventory.map(i => `
              <span class="chip chip-jade">
                ${pillIcon(i.pill.t)} ${i.pill.n}×${i.count}
              </span>
            `).join('')
          : '<span class="dimmer2 small">库存空空</span>'}

      </div>

      ${!recipes.length
        ? '<div class="empty">尚未掌握任何丹方</div>'
        : Object.keys(byTier).sort((a, b) => +a - +b).map(tier => `
            <div class="section-divider">${tier}品丹药</div>
            ${byTier[tier].map(p => {
              const can = (G.stone || 0) >= p.c;
              const isBr = p.ef === 'br';
              const tierLabel = `t${Math.min(9, p.t)}`;
              return `
                <div class="mc ${can ? '' : 'locked'}" data-pill="${p.id}">
                  <div class="mc-title">
                    <span>
                      <svg class="icon icon-16" style="vertical-align:middle"><use href="#ico-pill-${tierLabel}"></use></svg>
                      ${p.n}
                    </span>
                    <span class="dimmer small">${p.t}品</span>
                  </div>
                  <div class="mc-desc">${p.d}</div>
                  <div class="mc-foot ${can ? '' : 'disabled'}">
                    ${can ? '✓ 可炼制' : '灵石不足'} · 需 ${fmt(p.c)} 灵石
                  </div>
                </div>
              `;
            }).join('')}
          `).join('')}
    </div>
  `;
}

/* =====================================================
 * 八十三、灵植页面
 * ===================================================== */
function renderPlant() {
  const maxSlots = 5 + (G.buildings.garden || 0) * 2;
  const plants = G.plants || [];

  /* 已种下 */
  const growing = plants.map(p => {
    const tmpl = PLANTS.find(x => x.id === p.tid);
    if (!tmpl) return null;
    const pct = Math.min(100, (p.grown / tmpl.y) * 100);
    return { plant: p, tmpl, pct, ready: p.grown >= tmpl.y };
  }).filter(Boolean);

  /* 全部品种 */
  const allPlants = PLANTS.slice().sort((a, b) => a.t - b.t);

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('field', 14)} 灵植圃</h3>
        <span class="hint">${plants.length}/${maxSlots} 块地</span>
      </div>

      ${growing.length ? `
        <div class="section-divider">已种植</div>
        ${growing.map(g => `
          <div class="mc" style="cursor:default">
            <div class="mc-title">
              <span>${plantIcon(g.tmpl)} ${g.tmpl.n}</span>
              <span style="color:${g.ready ? 'var(--good)' : 'var(--ink-3)'};font-size:11px">
                ${g.plant.grown}/${g.tmpl.y} 年
              </span>
            </div>
            <div class="bar" style="height:5px">
              <div class="bar-fill good" style="width:${g.pct.toFixed(1)}%"></div>
            </div>
            ${g.ready ? `<button class="btn tiny mt6" data-harvest="${g.plant.id}">立即收获</button>` : ''}
          </div>
        `).join('')}
      ` : ''}

      <div class="section-divider">可种植</div>
      ${allPlants.map(t => {
        const can = (G.stone || 0) >= t.c && plants.length < maxSlots;
        return `
          <div class="mc ${can ? '' : 'locked'}" data-plant="${t.id}">
            <div class="mc-title">
              <span>${plantIcon(t)} ${t.n}</span>
              <span class="dimmer small">${t.t}阶 · ${t.y}年</span>
            </div>
            <div class="mc-desc">${t.d}</div>
            <div class="mc-foot ${can ? '' : 'disabled'}">
              ${can ? '✓ 可种植' : '灵石不足/地满'} · 需 ${fmt(t.c)} 灵石
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* =====================================================
 * 八十四、灵兽页面
 * ===================================================== */
function renderBeast() {
  const maxSlots = 3 + (G.buildings.pasture || 0) * 2;
  const owned = G.beasts || [];

  /* 按品阶分组 */
  const byTier = {};
  for (const b of owned) {
    if (!byTier[b.t]) byTier[b.t] = [];
    byTier[b.t].push(b);
  }

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 灵兽栏</h3>
        <span class="hint">${owned.length}/${maxSlots} 只</span>
      </div>

      ${owned.length ? `
        <div class="section-divider">已驯养</div>
        ${Object.keys(byTier).sort((a, b) => +a - +b).map(tier => `
          <div class="dimmer small mt6" style="letter-spacing:0.5px">${tier}阶灵兽</div>
          ${byTier[tier].map(b => `
            <div class="list-item" style="display:flex;align-items:center;gap:10px;padding:9px 8px">
              <div class="round-avatar" style="width:40px;height:40px">
                ${beastIcon(b)}
              </div>
              <div style="flex:1;min-width:0">
                <div style="font-weight:700;color:var(--ink)">${b.n}</div>
                <div class="li-row2" style="margin-top:2px">
                  <span>战力 +${fmt(b.p)}</span>
                  <span>寿 ${b.age || 0}/${b.lifeMax || b.l}</span>
                  <span>${b.d || ''}</span>
                </div>
              </div>
            </div>
          `).join('')}
        `).join('')}
      ` : `
        <div class="empty">
          <div class="em-title">兽栏空空</div>
          尚无可驯养的灵兽
        </div>
      `}

      <div class="section-divider">可捕捉</div>
      ${BEASTS
        .filter(b => b.t <= Math.min(5, G.player.realm + 1))
        .map(b => {
          const can = (G.stone || 0) >= b.c && owned.length < maxSlots;
          return `
            <div class="mc ${can ? '' : 'locked'}" data-beast="${b.id}">
              <div class="mc-title">
                <span>${beastIcon(b)} ${b.n}</span>
                <span class="dimmer small">${b.t}阶</span>
              </div>
              <div class="mc-desc">${b.d}</div>
              <div class="mc-foot ${can ? '' : 'disabled'}">
                ${can ? '✓ 可驯养' : '灵石不足/栏满'} · 需 ${fmt(b.c)} 灵石
              </div>
            </div>
          `;
        }).join('')}
    </div>
  `;
}

/* =====================================================
 * 八十五、阵法页面
 * ===================================================== */
function renderFormation() {
  const formLv = G.formO || {};

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 护家阵法</h3>
        <span class="hint">8 阵可选</span>
      </div>
      ${FORMATIONS.map(f => {
        const lv = formLv[f.id] || 0;
        const cost = Math.floor(f.b * (lv + 1) * Math.pow(1.2, lv));
        const can = (G.stone || 0) >= cost && lv < f.m;
        const upkeep = f.up * (lv + 1);

        return `
          <div class="br">
            <div class="br-info">
              <div class="br-name">${f.n} Lv.${lv}/${f.m}</div>
              <div class="br-desc">${f.d(lv)} · 维护 ${upkeep} 灵石/年</div>
            </div>
            <button class="btn tiny" data-form="${f.id}" ${can ? '' : 'disabled'}>
              ${lv >= f.m ? '已满级' : `升级 ${fmt(cost)}`}
            </button>
          </div>
        `;
      }).join('')}
    </div>
  `;
}
</script>
<script>
/* =====================================================
 * 八十六、基建页面
 * ===================================================== */
function renderBuild() {
  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 家族基建</h3>
        <span class="hint">灵石 ${fmt(G.stone || 0)}</span>
      </div>
      ${Object.keys(BLD).map(key => {
        const cfg = BLD[key];
        const lv = G.buildings[key] || 0;
        const cost = Math.floor(cfg.b * (lv + 1) * Math.pow(1.15, lv));
        const can = (G.stone || 0) >= cost;
        return `
          <div class="br">
            <div class="br-info">
              <div class="br-name">${cfg.n} Lv.${lv}</div>
              <div class="br-desc">${cfg.d(lv)}</div>
            </div>
            <button class="btn tiny ${can ? 'jade' : ''}" data-build="${key}" ${can ? '' : 'disabled'}>
              升级 ${fmt(cost)}
            </button>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* =====================================================
 * 八十七、宗门页面
 * ===================================================== */
function renderSect() {
  if (!G.isSect) {
    const topRealm = Math.max(
      G.player.realm,
      ...G.family.map(p => p.realm)
    );
    return `
      <div class="card">
        <div class="card-head"><h3>${icon('gate', 14)} 宗门</h3></div>
        <div class="empty">
          <div class="em-title">尚未立派</div>
          家族出现<b style="color:var(--gold)">元婴期</b>修士后可立宗<br>
          <span class="dimmer2 small">当前家族最强者：${REALMS[topRealm].n}</span>
        </div>
      </div>
    `;
  }

  const lv = SECT_LEVELS[G.sectLevel];
  const next = SECT_LEVELS[G.sectLevel + 1];
  const topRealm = Math.max(
    G.player.realm,
    ...G.family.map(p => p.realm)
  );
  const memberCount = G.family.length + 1;

  /* 宗门弟子列表（按职位） */
  const ranked = G.family
    .slice()
    .sort((a, b) => {
      const ra = calcSectRank(a).id || 0;
      const rb = calcSectRank(b).id || 0;
      return rb - ra || b.realm - a.realm;
    })
    .slice(0, 12);

  /* 宗门任务 */
  const quests = G.sectQuests || [];

  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('gate', 14)} 顾氏宗门</h3>
        <span class="hint">${lv.n}</span>
      </div>

      <div class="grid-3" style="margin-bottom:10px">
        <div class="cell-box">
          <div class="lbl">宗门等级</div>
          <div class="val">${lv.n}</div>
        </div>
        <div class="cell-box">
          <div class="lbl">掌门</div>
          <div class="val" style="font-size:12px">${G.player.name}</div>
        </div>
        <div class="cell-box">
          <div class="lbl">弟子</div>
          <div class="val">${memberCount}<span class="dimmer small">/${lv.maxMembers}</span></div>
        </div>
      </div>

      <div class="br" style="border-top:1px dashed var(--border-2);padding-top:10px">
        <div class="br-info">
          <div class="br-name">丹药品阶上限</div>
          <div class="br-desc">已达 ${lv.pillTier} 品</div>
        </div>
      </div>
      <div class="br">
        <div class="br-info">
          <div class="br-name">功法阶位上限</div>
          <div class="br-desc">已达 ${lv.techTier} 阶</div>
        </div>
      </div>
      <div class="br">
        <div class="br-info">
          <div class="br-name">灵植品阶上限</div>
          <div class="br-desc">已达 ${lv.plantTier} 阶</div>
        </div>
      </div>

      ${next ? `
        <div class="br" style="background:rgba(90,138,106,0.06);padding:10px;border-radius:4px;margin-top:10px">
          <div class="br-info">
            <div class="br-name" style="color:var(--jade-3)">晋升条件：${next.n}</div>
            <div class="br-desc">
              需家族有人达【${REALMS[next.needRealm].n}】
              （当前 ${REALMS[topRealm].n}）
            </div>
          </div>
          ${topRealm >= next.needRealm
            ? `<button class="btn tiny primary" data-sectlvlup="1">晋升</button>`
            : `<span class="chip chip-cinnabar">未达成</span>`}
        </div>
      ` : '<div class="center dimmer small mt10">已达最高等级 · 圣地</div>'}
    </div>

    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 弟子</h3>
        <span class="hint">按职位排序</span>
      </div>
      ${ranked.map(p => {
        const rank = calcSectRank(p);
        const contrib = p.sectContrib || 0;
        return `
          <div class="list-item" style="padding:8px">
            <div class="li-title">
              <span class="li-name">${p.name}</span>
              <span class="rk ${REALM_RK[p.realm]}">${realmLabel(p)}</span>
              <span class="chip chip-jade">${rank.n}</span>
            </div>
            <div class="li-row2">
              <span>贡献 ${contrib}</span>
              ${p.questActive ? `<span class="chip chip-gold">执行中</span>` : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>

    ${quests.length ? `
      <div class="card">
        <div class="card-head">
          <h3>${icon('scroll', 14)} 宗门任务</h3>
          <span class="hint">${quests.length} 个待办</span>
        </div>
        ${quests.map(q => `
          <div class="mc" data-quest="${q.id}">
            <div class="mc-title">
              <span>【${q.typeName}】</span>
              <span class="dimmer small">难度 ${q.difficulty.toFixed(1)}</span>
            </div>
            <div class="mc-desc">
              需 ${REALMS[q.minRealm].n} · 危险 ${(q.danger * 100).toFixed(0)}% · 奖贡献 ${q.reward}
            </div>
            <div class="mc-foot">✓ 点击派遣弟子</div>
          </div>
        `).join('')}
      </div>
    ` : ''}
  `;
}

/* =====================================================
 * 八十八、家训页面
 * ===================================================== */
function renderRule() {
  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 家训</h3>
        <span class="hint">当前：${getRule().n}</span>
      </div>
      ${FAMILY_RULES.map(r => {
        const active = r.id === G.familyRule;
        return `
          <div class="mc" data-rule="${r.id}"
               style="${active ? 'background:rgba(90,138,106,0.15);border-color:var(--jade)' : ''}">
            <div class="mc-title">
              <span>${r.n}${active ? ' <span class="chip chip-jade" style="font-size:9.5px">当前</span>' : ''}</span>
            </div>
            <div class="mc-desc">${r.d}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* =====================================================
 * 八十九、势力页面
 * ===================================================== */
function renderFaction() {
  const factions = (G.npcFamilies || []).filter(f => f.alive);
  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 天下势力</h3>
        <span class="hint">${factions.length} 个活跃</span>
      </div>
      ${!factions.length
        ? '<div class="empty">天下暂无活跃势力</div>'
        : factions.map(f => {
            const label = RELATION_LABELS.find(l =>
              f.rel >= l.min && f.rel < l.max) || RELATION_LABELS[3];
            return `
              <div class="list-item">
                <div class="li-title">
                  <span class="li-name">${f.n}</span>
                  <span class="chip">${f.type}</span>
                  <span style="color:${label.color};font-weight:600;font-size:11.5px">
                    ${label.label} ${f.rel > 0 ? '+' : ''}${f.rel}
                  </span>
                </div>
                <div class="li-row2 dimmer small">
                  <span>势力 ${fmt(f.power)}</span>
                  <span>成员 ${f.members || '-'}</span>
                </div>
              </div>
            `;
          }).join('')}
    </div>
  `;
}

/* =====================================================
 * 九十、战报页面
 * ===================================================== */
function renderWar() {
  const hist = G.history.filter(h => /交战|妖兽潮|覆灭|崛起/.test(h.t));
  const nextTide = G.beastTideYear ? G.beastTideYear - G.year : 0;
  const nextWar = G.nextWarYear ? G.nextWarYear - G.year : 0;

  return `
    ${nextTide > 0 ? `
      <div class="banner tide">
        🐺 妖兽潮将在 ${Math.max(0, nextTide)} 年后到来
      </div>
    ` : ''}
    ${nextWar > 0 ? `
      <div class="banner war">
        ⚔ 天下大战在即（约 ${Math.max(0, nextWar)} 年后）
      </div>
    ` : ''}

    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 战报</h3>
        <span class="hint">家族战力 ${fmt(familyPower())}</span>
      </div>
      ${hist.length
        ? hist.slice().reverse().slice(0, 20).map(h => `
            <div class="hi"><b>第${h.y}年</b>${h.t}</div>
          `).join('')
        : '<div class="empty">天下太平，无战事</div>'}
    </div>
  `;
}

/* =====================================================
 * 九十一、主线页面
 * ===================================================== */
function renderQuest() {
  const done = (G.mainQuests || []).filter(q => q.done).length;
  const total = (G.mainQuests || []).length;
  return `
    <div class="card">
      <div class="card-head">
        <h3>${icon('scroll', 14)} 天命</h3>
        <span class="hint">${done}/${total}</span>
      </div>
      <div class="bar">
        <div class="bar-fill gold" style="width:${(done / total * 100).toFixed(1)}%"></div>
      </div>
      <div class="mt12">
        ${(G.mainQuests || []).map(q => {
          const tech = q.r.tech ? TECHNIQUES.find(t => t.id === q.r.tech) : null;
          return `
            <div class="list-item"
                 style="border-left:3px solid ${q.done ? 'var(--good)' : 'var(--jade)'};
                        ${q.done ? 'opacity:0.6' : ''}">
              <div style="font-weight:700;color:var(--jade-3);font-size:13px">

function renderModalIfNeeded() {
  /* 由 showNextDecision 统一处理 */
}

function showNextDecision() {
  if (!UI.decisionQueue.length) {
    document.getElementById('modal').classList.remove('show');
    UI.modalOpen = false;
    render();
    return;
  }

  const e = UI.decisionQueue.shift();
  UI.modalOpen = true;

  const modal = document.getElementById('modal');
  const card = document.getElementById('moCard');

  /* 类型样式 */
  card.classList.remove('war', 'tide', 'tribulation');
  if (e.isWar) card.classList.add('war');
  if (e.isTide) card.classList.add('tide');
  if (e.isTribulation) card.classList.add('tribulation');

  /* 标题 */
  document.getElementById('moTitle').innerHTML = e.title || '';

  /* 副标题 */
  const subEl = document.getElementById('moSub');
  if (subEl) {
    subEl.textContent = e.sub || '';
    subEl.style.display = e.sub ? 'block' : 'none';
  }

  /* 内容 */
  document.getElementById('moBody').innerHTML = e.desc || '';

  /* 选项 */
  const choicesEl = document.getElementById('moChoices');
  choicesEl.innerHTML = '';
  (e.choices || []).forEach(c => {
    if (!c || !c.text) return;
    const btn = document.createElement('button');
    const risk = c.risk || '稳';
    /* 中文标签 → class 映射 */
    const riskMap = { '稳': 'risk-low', '中': 'risk-mid', '险': 'risk-high', 'low': 'risk-low', 'mid': 'risk-mid', 'high': 'risk-high' };
    const riskClass = riskMap[risk] || 'risk-low';
    btn.className = riskClass;
    btn.textContent = c.text;

    btn.onclick = () => {
      try {
        if (c.run) c.run();
      } catch (err) {
        console.error('事件选项执行错误', err);
        addLog('事件处理出错：' + err.message, 'bad');
      }
      document.getElementById('modal').classList.remove('show');
      UI.modalOpen = false;
      render();
      setTimeout(showNextDecision, 60);
    };
    choicesEl.appendChild(btn);
  });

  modal.classList.add('show');
}

/* =====================================================
 * 九十七、点击族人 → 详情弹窗
 * ===================================================== */
function openPersonDetail(pid) {
  const p = getP(pid);
  if (!p) return;

  const bl = getBL(p);
  const per = getPer(p);
  const lm = lifeMax(p);
  const need = expNeed(p);
  const pct = Math.min(100, (p.exp / need) * 100);
  const bd = breakRateDetail(p);
  const rank = personRank(p);

  const spouses = (p.spouseIds || []).map(id => getP(id)).filter(Boolean);
  const children = G.family.filter(x =>
    x.fatherId === p.id || x.motherId === p.id);
  const father = p.fatherId ? getP(p.fatherId) : null;
  const mother = p.motherId ? getP(p.motherId) : null;

  /* 雷达图（灵根） */
  const radar = renderRadarSVG(p.root, 110);

  /* 效果 chips */
  const healthChip = p.health === 'injured'
    ? '<span class="chip chip-cinnabar">伤势未愈</span>'
    : p.health === 'sick'
    ? '<span class="chip chip-cinnabar">身染旧疾</span>'
    : '<span class="chip chip-jade">安康</span>';

  UI.decisionQueue.push({
    title: p.name,
    sub: `${realmLabel(p)} · ${rank}`,
    desc: `
      <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex-shrink:0">${radar}</div>
        <div style="flex:1;min-width:140px;font-size:12px;line-height:1.9">
          <div><b>${rootLabel(p.root)}</b></div>
          <div class="dimmer">${rootTierText(p.root)}</div>
          <div>寿元：<b>${p.age}/${lm}</b></div>
          <div>天赋：<b>${p.talent.toFixed(2)}</b></div>
          <div>战力：<b>${fmt(power(p))}</b></div>
        </div>
      </div>

      <div class="bar" style="margin-top:12px">
        <div class="bar-fill ${pct >= 100 ? 'gold' : ''}" style="width:${pct.toFixed(1)}%"></div>
      </div>
      <div class="small dimmer" style="margin-top:4px">
        修为 ${fmt(p.exp)} / ${fmt(need)}
        ${pct >= 100 ? `· 突破率 ${(bd.final * 100).toFixed(1)}%` : ''}
      </div>

      <div style="margin-top:12px;line-height:1.9;font-size:12.5px;color:var(--ink-2)">
        <div>血脉：<b>${bl.n}</b>　性格：<b>${per.n}</b></div>
        ${father ? `<div>父：${father.name}</div>` : ''}
        ${mother ? `<div>母：${mother.name}</div>` : ''}
        ${spouses.length ? `<div>道侣：${spouses.map(s => s.name).join('、')}</div>` : ''}
        ${children.length ? `<div>子嗣：${children.length} 人</div>` : ''}
        ${p.lifeBound ? `<div>本命法宝：<b>${p.lifeBound.name}</b></div>` : ''}
      </div>

      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">
        ${healthChip}
        ${p.isProdigy ? '<span class="chip chip-gold">天骄</span>' : ''}
        ${p.demon > 0 ? `<span class="chip chip-cinnabar">心魔 ×${p.demon}</span>` : ''}
      </div>
    `,
    choices: [
      /* 家主：专属操作 */
      p.isPlayer ? {
        text: '闭关冲关（若修为已满）',
        risk: '中',
        run: () => {
          if (p.exp < need * 0.4) {
            addLog('修为不足，改为静修。', 'event');
            p.exp += Math.floor(expGain(p) * 8);
            return;
          }
          if (isBigBreakthrough(p)) {
            startBigBreakthrough(p, true);
          } else if (chance(cl(breakRate(p) * 1.5, 0.05, 0.95))) {
            doSmallBreakthrough(p, true);
          } else {
            const loss = Math.floor(p.exp * 0.25);
            p.exp = Math.max(0, p.exp - loss);
            p.demon = clamp((p.demon || 0) + 1, 0, 3);
            addLog(`家主闭关失败，损失修为 ${fmt(loss)}。`, 'bad');
          }
        }
      } : null,
      /* 他人：命令做事 */
      !p.isPlayer && p.age >= 16 ? {
        text: '令其潜修（5 年）',
        risk: '稳',
        run: () => {
          p.exp += Math.floor(expGain(p) * 5 * 3);
          addLog(`${p.name} 奉命潜修。`, 'good');
        }
      } : null,
      !p.isPlayer && p.age >= 16 && !p.questActive ? {
        text: '命其外出历练',
        risk: '中',
        run: () => {
          if (chance(0.6 + p.talent * 0.2)) {
            p.exp += Math.floor(expNeed(p) * 0.4);
            G.stone += rnd(50, 300);
            addLog(`${p.name} 历练归来，修为与灵石俱增。`, 'good');
          } else if (chance(0.3)) {
            p.health = 'injured';
            p.injuredYears = rnd(1, 3);
            addLog(`${p.name} 历练受挫，负伤而归。`, 'bad');
          } else {
            addLog(`${p.name} 历练归来，无甚收获。`, 'event');
          }
        }
      } : null,
      {
        text: '改名',
        risk: '稳',
        run: () => {
          openRenameDialog(p);
        }
      },
      {
        text: '关闭',
        risk: '稳',
        run: () => {}
      }
    ].filter(Boolean)
  });
  showNextDecision();
}

/* =====================================================
 * 九十八、雷达图 SVG
 * ===================================================== */
function renderRadarSVG(root, size) {
  size = size || 120;
  const cx = size / 2;
  const cy = size / 2;
  const R = size / 2 - 22;
  const keys = ['金', '木', '水', '火', '土'];
  const values = keys.map(k => root[k] || 0);

  function pt(i, r) {
    const angle = -Math.PI / 2 + (Math.PI * 2 * i) / 5;
    return [cx + Math.cos(angle) * r, cy + Math.sin(angle) * r];
  }

  /* 背景网格 */
  let gridHtml = '';
  for (let lv = 1; lv <= 5; lv++) {
    const r = (R * lv) / 5;
    const pts = [];
    for (let i = 0; i < 5; i++) {
      const p = pt(i, r);
      pts.push(`${p[0].toFixed(1)},${p[1].toFixed(1)}`);
    }
    gridHtml += `<polygon points="${pts.join(' ')}" fill="none" stroke="rgba(90,138,106,0.18)" stroke-width="1"/>`;
  }

  /* 五条射线 */
  let linesHtml = '';
  for (let i = 0; i < 5; i++) {
    const p = pt(i, R);
    linesHtml += `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="rgba(90,138,106,0.22)" stroke-width="1"/>`;
  }

  /* 数据多边形 */
  const dataPts = [];
  for (let i = 0; i < 5; i++) {
    const v = Math.min(1, Math.max(0, values[i]));
    const r = R * v;
    const p = pt(i, r);
    dataPts.push(`${p[0].toFixed(1)},${p[1].toFixed(1)}`);
  }

  /* 数据点 */
  let dotsHtml = '';
  for (let i = 0; i < 5; i++) {
    const v = Math.min(1, Math.max(0, values[i]));
    if (v <= 0) continue;
    const p = pt(i, R * v);
    dotsHtml += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#5a8a6a"/>`;
  }

  /* 标签 */
  let labelsHtml = '';
  for (let i = 0; i < 5; i++) {
    const p = pt(i, R + 16);
    const v = values[i];
    const color = v > 0 ? '#3a6a4a' : '#a8b8a8';
    const txt = keys[i] + (v > 0 ? v.toFixed(1) : '0');
    labelsHtml += `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" font-size="10.5" fill="${color}" text-anchor="middle" dominant-baseline="middle" font-family="STKaiti,KaiTi,serif" font-weight="600">${txt}</text>`;
  }

  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${gridHtml}
      ${linesHtml}
      <polygon points="${dataPts.join(' ')}" fill="rgba(90,138,106,0.22)" stroke="#5a8a6a" stroke-width="1.6"/>
      ${dotsHtml}
      ${labelsHtml}
    </svg>
  `;
}

/* =====================================================
 * 九十九、改名弹窗
 * ===================================================== */
function openRenameDialog(person) {
  /* 弹窗用原生 prompt 简化（浏览器原生，稳定） */
  const newName = prompt(`请为 ${person.name} 起个新名字（最多 6 字）`, person.name);
  if (!newName) return;
  const trimmed = newName.trim().slice(0, 6);
  if (!trimmed) return;
  const oldName = person.name;
  person.name = trimmed;
  /* 同步更新别人的引用 */
  G.family.forEach(p => {});
  addLog(`${oldName} 更名为 ${trimmed}。`, 'event');
  render();
}

/* =====================================================
 * 一〇〇、宗门任务派发
 * ===================================================== */
function openQuestDispatch(questId) {
  const quest = (G.sectQuests || []).find(q => q.id === questId);
  if (!quest) return;

  /* 找可用弟子 */
  const candidates = G.family.filter(p =>
    !p.questActive && p.realm >= quest.minRealm && p.age >= 14);
  if (!candidates.length) {
    addLog('宗门中无合适弟子可派。', 'bad');
    return;
  }

  const top = candidates.slice(0, 6);

  UI.decisionQueue.push({
    title: `派遣弟子 · ${quest.typeName}`,
    desc: `任务难度 ${quest.difficulty.toFixed(1)} · 奖贡献 ${quest.reward}<br>请派遣一名弟子执行。`,
    choices: top.map(p => ({
      text: `${p.name}（${realmLabel(p)}·贡献${p.sectContrib || 0}）`,
      risk: '稳',
      run: () => {
        const r = dispatchQuest(questId, p.id);
        if (r.ok) addLog(r.msg, 'good');
        else addLog(r.msg, 'bad');
      }
    })).concat([
      { text: '取消', risk: '稳', run: () => {} }
    ])
  });
  showNextDecision();
}

/* =====================================================
 * 一〇一、炼制丹药
 * ===================================================== */
function craftPill(pid) {
  const pill = PILLS.find(p => p.id === pid);
  if (!pill) return;
  if ((G.stone || 0) < pill.c) {
    addLog(`灵石不足，无法炼制【${pill.n}】。`, 'bad');
    return;
  }
  G.stone -= pill.c;

  /* 炼丹成功率：天赋越高越容易 */
  const rate = 0.55 + G.player.talent * 0.2;
  if (chance(rate)) {
    const count = rnd(1, 2);
    G.pills[pid] = (G.pills[pid] || 0) + count;
    addLog(`✦ 成功炼得【${pill.n}】×${count}。`, 'good');
  } else {
    addLog(`炼制【${pill.n}】失败，材料报废。`, 'bad');
  }
  render();
}

/* =====================================================
 * 一〇二、种植灵植
 * ===================================================== */
function plantSeed(plantId) {
  const tmpl = PLANTS.find(p => p.id === plantId);
  if (!tmpl) return;
  if ((G.stone || 0) < tmpl.c) {
    addLog(`灵石不足，无法种植【${tmpl.n}】。`, 'bad');
    return;
  }
  const maxSlots = 5 + (G.buildings.garden || 0) * 2;
  if ((G.plants || []).length >= maxSlots) {
    addLog(`灵植圃已满（${maxSlots} 块地）。`, 'bad');
    return;
  }
  G.stone -= tmpl.c;
  G.plants.push({
    id: G.nextId++,
    tid: tmpl.id,
    plantedYear: G.year,
    grown: 0
  });
  addLog(`种下【${tmpl.n}】，需 ${tmpl.y} 年成熟。`, 'good');
  render();
}

/* =====================================================
 * 一〇三、立即收获
 * ===================================================== */
function harvestNow(plantId) {
  const p = G.plants.find(x => x.id === plantId);
  if (!p) return;
  const tmpl = PLANTS.find(x => x.id === p.tid);
  if (!tmpl) return;
  applyPlantEffect(tmpl);
  addLog(`✦ 收获【${tmpl.n}】，效果已生效。`, 'good');
  G.plants = G.plants.filter(x => x !== p);
  render();
}

/* =====================================================
 * 一〇四、驯养灵兽
 * ===================================================== */
function tameBeast(beastId) {
  const tmpl = BEASTS.find(b => b.id === beastId);
  if (!tmpl) return;
  const maxSlots = 3 + (G.buildings.pasture || 0) * 2;
  if ((G.beasts || []).length >= maxSlots) {
    addLog(`兽栏已满（${maxSlots} 只）。`, 'bad');
    return;
  }
  if ((G.stone || 0) < tmpl.c) {
    addLog('灵石不足。', 'bad');
    return;
  }
  if (tmpl.t > Math.min(5, G.player.realm + 1)) {
    addLog('修为不足，无法驯养此兽。', 'bad');
    return;
  }
  G.stone -= tmpl.c;
  if (chance(0.65 + G.player.talent * 0.1)) {
    G.beasts.push({ ...tmpl, age: 0, lifeMax: tmpl.l, bornYear: G.year });
    addLog(`✦ 成功驯养【${tmpl.n}】！`, 'special');
  } else {
    addLog(`驯养【${tmpl.n}】失败，灵兽逃入山林。`, 'bad');
  }
  render();
}

/* =====================================================
 * 一〇五、升级阵法
 * ===================================================== */
function upgradeFormation(fid) {
  const f = FORMATIONS.find(x => x.id === fid);
  if (!f) return;
  const lv = G.formO[fid] || 0;
  if (lv >= f.m) {
    addLog(`${f.n} 已达最高等级。`, 'bad');
    return;
  }
  const cost = Math.floor(f.b * (lv + 1) * Math.pow(1.2, lv));
  if ((G.stone || 0) < cost) {
    addLog(`灵石不足（需 ${fmt(cost)}）。`, 'bad');
    return;
  }
  G.stone -= cost;
  G.formO[fid] = lv + 1;
  addLog(`${f.n} 升至 Lv.${lv + 1}。`, 'good');
  render();
}

/* =====================================================
 * 一〇六、升级建筑
 * ===================================================== */
function buildUp(key) {
  const cfg = BLD[key];
  if (!cfg) return;
  const lv = G.buildings[key] || 0;
  const cost = Math.floor(cfg.b * (lv + 1) * Math.pow(1.15, lv));
  if ((G.stone || 0) < cost) {
    addLog(`灵石不足（需 ${fmt(cost)}）。`, 'bad');
    return;
  }
  G.stone -= cost;
  G.buildings[key] = lv + 1;
  addLog(`${cfg.n} 升至 Lv.${lv + 1}。`, 'good');
  render();
}

/* =====================================================
 * 一〇七、切换家训
 * ===================================================== */
function setRule(rid) {
  const r = FAMILY_RULES.find(x => x.id === rid);
  if (!r) return;
  if (rid === G.familyRule) return;
  G.familyRule = rid;
  addLog(`家主颁布家训【${r.n}】：${r.d}`, 'event');
  render();
}

/* =====================================================
 * 一〇八、存档导入导出
 * ===================================================== */
function openExportDialog() {
  const str = exportSave();
  if (!str) return;
  /* 用 prompt 展示（用户可复制） */
  prompt('复制以下文本保存（可粘贴到其它设备导入）：', str);
  addLog('✅ 存档已导出，请复制文本框内容。', 'good');
}

function openImportDialog() {
  const str = prompt('请粘贴之前导出的存档文本：', '');
  if (!str) return;
  if (importSave(str.trim())) {
    render();
  }
}

/* =====================================================
 * 一〇九、进入秘境
 * ===================================================== */
function enterRealm(realmId) {
  const r = (G.secretRealms || []).find(x => x.id === realmId);
  if (!r) return;
  if (G.player.realm < r.minRealm) {
    addLog(`修为不足，无法进入【${r.name}】。`, 'bad');
    return;
  }

  UI.selectedAction = null;
  G.secretRealms = G.secretRealms.filter(x => x.id !== realmId);

  const p = G.player;
  const rule = getRule();
  let dangerMod = r.danger * (1.15 - rootQuality(p.root) * 0.3);
  if (rule.id === 'yin') dangerMod *= 0.6;
  const defLv = G.formO.def || 0;
  dangerMod *= 1 - Math.min(0.7, defLv * 0.08);

  addLog(`家主独身闯入【${r.name}】……`, 'event');

  if (chance(dangerMod)) {
    /* 危险 */
    if (chance(0.3)) {
      const dc = Math.max(0, 0.35 - p.realm * 0.03);
      if (chance(dc)) {
        addLog('✖ 家主不幸陨落！', 'bad');
        p.age = lifeMax(p) + 1;
        handlePlayerDeath();
        render();
        return;
      }
      const loss = Math.floor(p.exp * 0.4);
      p.exp = Math.max(0, p.exp - loss);
      addLog(`家主重伤而归，修为损失 ${fmt(loss)}。`, 'bad');
    } else {
      const loss = Math.floor(p.exp * 0.15);
      p.exp = Math.max(0, p.exp - loss);
      addLog('家主轻伤退出。', 'event');
    }
  } else {
    /* 收获 */
    const sg = rnd(r.stone[0], r.stone[1]) + Math.floor(familyPower() / 50);
    const eg = rnd(r.exp[0], r.exp[1]);
    G.stone += sg;
    p.exp += eg;
    if (r.rep) G.reputation += r.rep;
    addLog(`探索【${r.name}】+${fmt(sg)} 灵石 +${fmt(eg)} 修为。`, 'good');

    if (r.artifactBonus > 0 && chance(0.35 + r.artifactBonus)) {
      const art = rollArtifact(r.artifactBonus + (G.buildings.forge || 0) * 0.03);
      p.artifacts = p.artifacts || [];
      p.artifacts.push(art);
      addLog(`✦ 得【${ARTIFACT_TIERS[art.tier].n}·${art.name}】！`, 'special');
    }
  }
  render();
}

/* =====================================================
 * 一一〇、法宝生成
 * ===================================================== */
function rollArtifact(bonus) {
  bonus = bonus || 0;
  const random = Math.random();
  let tier;
  if (random < 0.005 + bonus * 0.3)      tier = 5;
  else if (random < 0.02 + bonus * 0.5)  tier = 4;
  else if (random < 0.08 + bonus * 1.2)  tier = 3;
  else if (random < 0.28 + bonus * 2)    tier = 2;
  else if (random < 0.60 + bonus * 2)    tier = 1;
  else                                    tier = 0;

  const cfg = ARTIFACT_TIERS[tier];
  const f = () => 0.85 + Math.random() * 0.3;

  return {
    name: pick(ART_PRE) + pick(ART_NOUN),
    tier: tier,
    e: +(cfg.e * f()).toFixed(3),
    b: +(cfg.b * f()).toFixed(3),
    p: Math.floor(cfg.p * f())
  };
}

/* =====================================================
 * 一二五、新游戏初始化
 * ===================================================== */
function newGame(opts) {
  opts = opts || {};
  const surname = opts.surname || '陈';
  const givenName = opts.givenName || '长生';
  const fullName = surname + givenName;

  /* 底蕴加成 */
  const leg = applyLegacy();

  /* 全局状态 */
  G = {
    version: 13,
    year: 1,
    generation: 1,
    nextId: 1,
    reputation: 100 + (leg.startRep || 0),
    stone: 80 + (leg.stone || 0),
    family: [],
    player: null,
    playerId: null,

    era: opts.era || 'peace',
    region: opts.region || 'center',
    familyRule: opts.familyRule || 'none',
    difficulty: opts.difficulty || 'normal',
    bloodlineId: opts.bloodlineId || 'none',

    buildings: Object.fromEntries(Object.keys(BLD).map(k => [k, 0])),

    isSect: false,
    sectLevel: 0,
    sectQuests: [],

    techniqueIds: ['swd01'],   /* 无剑诀起步 */
    pillRecipes: ['hy', 'zj'], /* 培元丹、筑基丹 */
    pills: {},

    beasts: [],
    plants: [],
    formO: { def: 0, spr: 0, kil: 0, det: 0, ice: 0, fir: 0, thn: 0, hea: 0 },

    npcFamilies: [],
    rivals: [],

    history: [],
    log: [],
    secretRealms: [],
    realmRefreshYear: 0,
    cemetery: [],
    cemeteryBonus: 0,
    titles: [],

    qiyun: 0,
    tribulationGear: 0,
    promoted: false,
    warGear: 0,

    beastTideYear: rnd(25, 35),
    nextWarYear: rnd(40, 70),

    mainQuests: MAIN_QUESTS.map(q => ({ ...q, done: false })),

    over: false
  };

  /* 家主 */
  const player = createPerson(fullName, {
    age: 22,
    gender: opts.gender || 'M',
    talent: opts.talent != null ? opts.talent : 0.8,
    root: opts.root || { 金: 0.9, 水: 0.7 },
    bloodlineId: opts.bloodlineId || 'none',
    personalityId: opts.personalityId || 'just',
    realm: 1,
    sub: 0,
    isPlayer: true
  });
  G.player = player;
  G.playerId = player.id;

  /* 初始道侣（外姓） */
  const wife = createPerson(genForeignName(), {
    age: 20,
    gender: opts.gender === 'M' ? 'F' : 'M',
    talent: clamp(0.7 + Math.random() * 0.15, 0, 1),
    root: { 水: 0.85, 木: 0.6 },
    realm: 1,
    sub: 0
  });
  player.spouseIds.push(wife.id);
  wife.spouseIds.push(player.id);
  G.family.push(wife);

  /* 族老 */
  const elder = createPerson(surname + '老', {
    age: rnd(45, 60),
    gender: 'M',
    talent: 0.5 + Math.random() * 0.2,
    realm: 1,
    sub: 2
  });
  G.family.push(elder);

  /* 一位族弟 */
  const cousin = createPerson(surname + pick(GIVN), {
    age: rnd(18, 25),
    gender: chance(0.5) ? 'M' : 'F',
    talent: 0.55 + Math.random() * 0.2,
    realm: 0,
    sub: 0
  });
  G.family.push(cousin);

  /* 底蕴祖传功法 */
  for (let i = 0; i < (leg.tech || 0); i++) {
    const pool = TECHNIQUES.filter(t => t.t <= 2 && !G.techniqueIds.includes(t.id));
    if (pool.length) G.techniqueIds.push(pick(pool).id);
  }

  /* 初始 NPC 势力 */
  spawnInitialFactions();

  /* 刷新秘境 */
  refreshSecretRealms(true);

  /* 气运 */
  recalcQiyun();

  /* 记录史册 */
  G.history.push({
    y: 1,
    t: `【第1代】${player.name} 立家，定于【${getRegion().n}】，当世【${getEra().n}】。`
  });

  /* 初始日志 */
  addLog(`家族建立！家主 ${player.name} 携道侣立足。`, 'special');
  addLog(`时代：${getEra().n} · 灵域：${getRegion().n}`, 'event');

  /* 重置 UI 状态 */
  UI.tab = 'family';
  UI.sub = 'home';
  UI.selectedAction = null;
  UI.selectedYears = 5;
  UI.decisionQueue = [];
  UI.modalOpen = false;
}

/* =====================================================
 * 一二六、初始 NPC 势力
 * ===================================================== */
function spawnInitialFactions() {
  const names = shuffle(NPC_NAMES).slice(0, 8);
  G.npcFamilies = [];
  for (const name of names) {
    G.npcFamilies.push({
      id: G.nextId++,
      n: name,
      type: pick(NPC_TYPES),
      power: rnd(500, 3000),
      rel: pick([-60, -40, -20, -10, 0, 5, 15, 25, 40]),
      members: rnd(5, 20),
      alive: true
    });
  }
}

            <button type="button" class="cc-diff"
                    data-diff="${d.id}"
                    style="padding:9px 10px;border:1px solid ${cc.difficulty === d.id ? 'var(--jade)' : 'var(--border)'};
                           border-radius:5px;background:${cc.difficulty === d.id ? 'var(--jade-soft)' : 'rgba(255,255,255,0.9)'};
                           font-family:inherit;color:var(--ink);font-size:12px;cursor:pointer;text-align:left">
              <div style="font-weight:700">${d.n}</div>
              <div class="dimmer" style="font-size:10.5px;margin-top:2px">${d.d}</div>
            </button>
          `).join('')}
        </div>

        <div class="section-divider">家训</div>
        <select id="cc-rule" style="${inputStyle}">
          ${FAMILY_RULES.map(r => `
            <option value="${r.id}" ${cc.familyRule === r.id ? 'selected' : ''}>
              ${r.n} —— ${r.d}
            </option>
          `).join('')}
        </select>
      </div>
    `;
  }

  titleEl.textContent = '🧙 开族立谱';

  /* 渲染 + 绑定 */
  function paint() {
    bodyEl.innerHTML = buildHtml();
    bindAll();
  }

  function bindAll() {
    document.querySelectorAll('.cc-gender').forEach(b => {
      b.onclick = () => { cc.gender = b.dataset.g; paint(); };
    });
    document.querySelectorAll('.cc-root').forEach(b => {
      b.onclick = () => { cc.rootId = b.dataset.root; paint(); };
    });
    document.querySelectorAll('.cc-diff').forEach(b => {
      b.onclick = () => { cc.difficulty = b.dataset.diff; paint(); };
    });
    const t = document.getElementById('cc-talent');
    if (t) {
      t.oninput = () => {
        cc.talent = +t.value;
        document.getElementById('cc-talent-val').textContent = cc.talent.toFixed(2);
      };
    }
    const sur = document.getElementById('cc-surname');
    if (sur) sur.oninput = () => { cc.surname = sur.value; };
    const giv = document.getElementById('cc-given');
    if (giv) giv.oninput = () => { cc.givenName = giv.value; };
    const blood = document.getElementById('cc-blood');
    if (blood) blood.onchange = () => { cc.bloodlineId = blood.value; };
    const per = document.getElementById('cc-per');
    if (per) per.onchange = () => { cc.personalityId = per.value; };
    const era = document.getElementById('cc-era');
    if (era) era.onchange = () => { cc.era = era.value; };
    const region = document.getElementById('cc-region');
    if (region) region.onchange = () => { cc.region = region.value; };
    const rule = document.getElementById('cc-rule');
    if (rule) rule.onchange = () => { cc.familyRule = rule.value; };
  }

  paint();

  /* 开始按钮 */
  choicesEl.innerHTML = '';
  const startBtn = document.createElement('button');
  startBtn.className = 'primary';
  startBtn.style.cssText = 'width:100%;padding:15px;font-size:15px;letter-spacing:4px;font-weight:700;margin-top:12px';
  startBtn.textContent = '开 族 立 谱';
  startBtn.onclick = () => {
    /* 收集数据 */
    const sur = (document.getElementById('cc-surname').value || '陈').trim().slice(0, 2) || '陈';
    const giv = (document.getElementById('cc-given').value || '').trim().slice(0, 6) || (pick(GIVN) + pick(GIVN));
    const rootOpt = ROOT_OPTIONS.find(r => r.id === cc.rootId) || ROOT_OPTIONS[3];

    /* 关闭弹窗 */
    modal.classList.remove('show');
    UI.modalOpen = false;
    UI.decisionQueue = [];

    /* 建立游戏 */
    newGame({
      surname: sur,
      givenName: giv,
      gender: cc.gender,
      root: JSON.parse(JSON.stringify(rootOpt.root)),
      bloodlineId: cc.bloodlineId,
      personalityId: cc.personalityId,
      talent: cc.talent,
      era: cc.era,
      region: cc.region,
      difficulty: cc.difficulty,
      familyRule: cc.familyRule
    });

    /* 启动 */
    render();

    setTimeout(() => {
      addLog('💡 选择年度行动后，点右下角「度岁」推进年份。', 'event');
      render();
    }, 120);
  };
  choicesEl.appendChild(startBtn);

  /* 打开弹窗 */
  modal.classList.add('show');
  UI.modalOpen = true;
}

/* =====================================================
 * 一二八、重置游戏：回到捏人
 * ===================================================== */
function resetGame() {
  document.getElementById('modal').classList.remove('show');
  UI.modalOpen = false;
  UI.decisionQueue = [];
  UI.selectedAction = null;
  setTimeout(() => {
    showCharacterCreator();
  }, 100);
}

/* =====================================================
 * 一二九、启动
 * ===================================================== */
function boot() {
  /* 加载跨局底蕴 */
  loadLegacy();

  /* 挂载图标库 */
  mountAllIcons();

  /* 显示捏人界面 */
  showCharacterCreator();
}

/* 页面加载完成时启动 */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
  <script>
/* ========== V13 补丁：补齐缺失的全局变量并重启 ========== */
window.UI = window.UI || {
  tab: 'family',
  sub: 'home',
  selectedAction: null,
  selectedYears: 5,
  modalOpen: false,
  decisionQueue: [],
  remainingYears: 0
};
window.LEGACY = window.LEGACY || { points: 0, upgrades: {} };
if (typeof G === 'undefined') window.G = null;

/* 修好变量后，重新启动 */
setTimeout(function () {
  if (typeof boot === 'function') {
    try {
      boot();
    } catch (e) {
      console.error('boot 失败:', e);
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c00;color:#fff;padding:12px;z-index:99999;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all';
      d.textContent = '❌ 补丁后仍失败：' + e.message;
      document.body.appendChild(d);
    }
  } else {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#e80;color:#fff;padding:12px;z-index:99999;font-size:12px;font-family:monospace';
    d.textContent = '⚠ 找不到 boot() 函数，代码可能被截断';
    document.body.appendChild(d);
  }
}, 100);
</script>

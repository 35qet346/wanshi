<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e8f0e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>仙脉世家 · 修仙家族模拟器</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #eef2ec;
  --bg-2: #d8e4dc;
  --card: rgba(255, 255, 255, 0.72);
  --card-solid: #f8fbf8;
  --card-2: rgba(240, 248, 240, 0.85);

  --border: rgba(90, 120, 90, 0.22);
  --border-2: rgba(90, 120, 90, 0.12);
  --border-hi: rgba(90, 140, 110, 0.55);

  --ink: #2a3a2a;
  --ink-2: #4a6a5a;
  --ink-3: #7a8a78;
  --ink-4: #a8b8a8;

  --jade: #5a8a6a;
  --jade-2: #7bb08a;
  --jade-3: #3a6a4a;
  --jade-soft: rgba(90, 138, 106, 0.12);
  --jade-deep: #2a5a3a;

  --azure: #7898b8;
  --azure-soft: rgba(120, 152, 184, 0.12);

  --cinnabar: #b83a30;
  --cinnabar-2: #d04840;
  --cinnabar-soft: rgba(184, 58, 48, 0.12);

  --wood: #a8763a;
  --wood-soft: rgba(168, 118, 58, 0.12);
  --gold: #c9a961;
  --gold-soft: rgba(201, 169, 97, 0.15);

  --good: #5a9a6a;
  --bad: #b85040;
  --warn: #c08a40;

  --r: 12px;
  --r-2: 8px;
  --r-3: 5px;

  --shadow: 0 4px 20px rgba(90, 120, 90, 0.08);
  --shadow-hi: 0 8px 32px rgba(90, 120, 90, 0.18);

  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

html, body {
  height: 100%;
  overscroll-behavior-y: none;
}

body {
  background: #eef2ec;
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -10%, #d6e4d8 0%, transparent 60%),
    linear-gradient(180deg, #e8f0e8 0%, #d8e4dc 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", "STKaiti", "KaiTi", serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: 100px;
  max-width: 100vw;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 0; height: 0; }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  outline: none;
  transition: 0.15s;
  -webkit-user-select: none;
  user-select: none;
}

/* ============ 顶栏 ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  border-bottom: 1px solid var(--border-2);
  padding: 9px 12px 0;
  padding-top: calc(9px + var(--safe-top));
  box-shadow: 0 2px 14px rgba(90, 120, 90, 0.05);
}

.seal-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.seal-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.seal-icon {
  width: 34px;
  height: 34px;
  border-radius: 5px;
  background: linear-gradient(135deg, #b83a30, #d04840);
  border: 1px solid rgba(184, 58, 48, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff8e8;
  font-size: 17px;
  font-weight: 900;
  font-family: "STKaiti", "KaiTi", serif;
  box-shadow: 0 2px 10px rgba(184, 58, 48, 0.32);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}

.seal-name {
  color: var(--ink);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 3px;
  white-space: nowrap;
}

.stat-cells {
  display: flex;
  gap: 5px;
  flex: 1;
  justify-content: flex-end;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.stat-cells::-webkit-scrollbar { display: none; }

.stat-cell {
  flex: 0 0 auto;
  min-width: 52px;
  padding: 3px 8px;
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid var(--border);
  border-radius: 5px;
  text-align: center;
}

.stat-val {
  color: #2a4a3a;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.1;
  font-family: "STKaiti", "KaiTi", serif;
}

.stat-lbl {
  color: var(--ink-3);
  font-size: 9.5px;
  margin-top: 1px;
  letter-spacing: 0.3px;
}

.gear-btn {
  width: 34px;
  height: 34px;
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--ink-2);
  font-size: 15px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.gear-btn:active {
  background: var(--jade-soft);
  transform: scale(0.96);
}

/* ============ 一级 Tab ============ */
.tab-row {
  display: flex;
  gap: 3px;
  margin: 6px -12px 0;
  border-bottom: 1px solid var(--border-2);
}

.tab-btn {
  flex: 1;
  padding: 9px 4px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--ink-3);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  cursor: pointer;
  position: relative;
}
.tab-btn.active {
  color: var(--jade-3);
  border-bottom-color: var(--jade);
}
.tab-btn:active {
  background: rgba(90, 120, 90, 0.06);
}
</style>
<style>
/* ============ 主内容区 ============ */
.content {
  max-width: 900px;
  margin: 0 auto;
  padding: 12px;
  padding-bottom: 100px;
}

/* ============ 卡片基础 ============ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px;
  margin-bottom: 12px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
  animation: fadeUp 0.3s ease both;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(90, 120, 90, 0.06);
  border-radius: calc(var(--r) - 2px);
  pointer-events: none;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: none; }
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
  position: relative;
}

.card-head h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--jade-3);
  letter-spacing: 3px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.card-head h3 svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.card-head .hint {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.5px;
}

/* ============ 按钮 ============ */
.btn {
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid var(--border);
  color: var(--ink);
  padding: 9px 14px;
  font-size: 13px;
  border-radius: var(--r-3);
  letter-spacing: 1px;
  font-family: inherit;
  position: relative;
}
.btn:active:not(:disabled) {
  background: var(--jade-soft);
  border-color: var(--border-hi);
  transform: scale(0.97);
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn.primary {
  background: linear-gradient(180deg, #5a8a6a, #3a6a4a);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(58, 106, 74, 0.3);
}
.btn.primary:active:not(:disabled) {
  background: linear-gradient(180deg, #6a9a7a, #4a7a5a);
  box-shadow: 0 2px 8px rgba(58, 106, 74, 0.25);
}

.btn.jade {
  background: var(--jade-soft);
  border-color: var(--border-hi);
  color: var(--jade-3);
}
.btn.jade:active:not(:disabled) {
  background: rgba(90, 138, 106, 0.22);
}

.btn.cinnabar {
  background: var(--cinnabar-soft);
  border-color: rgba(184, 58, 48, 0.4);
  color: var(--cinnabar);
}
.btn.cinnabar:active:not(:disabled) {
  background: rgba(184, 58, 48, 0.2);
}

.btn.ghost {
  background: transparent;
  border-color: var(--border);
}

.btn.sel {
  background: var(--jade-soft);
  border-color: var(--jade);
  color: var(--jade-3);
  font-weight: 600;
  box-shadow: 0 0 0 2px rgba(90, 138, 106, 0.12);
}

.btn.small {
  padding: 5px 10px;
  font-size: 11.5px;
  letter-spacing: 0.5px;
}

.btn.tiny {
  padding: 3px 8px;
  font-size: 11px;
  letter-spacing: 0;
}

.btn.full {
  width: 100%;
}

/* ============ 二级标签 ============ */
.sub-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  margin-bottom: 12px;
  padding: 2px 0;
  position: relative;
}
.sub-tabs::-webkit-scrollbar { display: none; }

.sub-tab {
  flex-shrink: 0;
  padding: 6px 14px;
  background: rgba(255, 255, 255, 0.75);
  border: 1px solid var(--border);
  color: var(--ink-3);
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  font-family: inherit;
  white-space: nowrap;
  transition: 0.15s;
}
.sub-tab.active {
  background: var(--jade-soft);
  border-color: var(--jade);
  color: var(--jade-3);
  box-shadow: 0 0 0 2px rgba(90, 138, 106, 0.1);
}
.sub-tab:active:not(.active) {
  background: rgba(255, 255, 255, 0.95);
}

/* ============ 数据格子 ============ */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.grid-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

@media (max-width: 500px) {
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .grid-4 { grid-template-columns: 1fr 1fr; }
}

/* ============ 数据格 ============ */
.cell-box {
  padding: 10px 8px;
  background: rgba(255, 255, 255, 0.75);
  border: 1px solid var(--border);
  border-radius: var(--r-3);
  text-align: center;
  transition: 0.15s;
}
.cell-box .lbl {
  font-size: 10.5px;
  color: var(--ink-3);
  letter-spacing: 0.5px;
}
.cell-box .val {
  font-size: 15px;
  font-weight: 700;
  color: var(--jade-3);
  margin-top: 3px;
  font-family: "STKaiti", "KaiTi", serif;
}

/* ============ 进度条 ============ */
.bar {
  height: 6px;
  background: rgba(90, 120, 90, 0.12);
  border-radius: 3px;
  overflow: hidden;
  margin: 6px 0;
  position: relative;
}
.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #7bb08a, #5a8a6a);
  border-radius: 3px;
  transition: width 0.4s ease;
}
.bar-fill.full {
  background: linear-gradient(90deg, #c9a961, #a88840);
}
.bar-fill.gold {
  background: linear-gradient(90deg, #d4af37, #c9a961);
}
.bar-fill.good {
  background: linear-gradient(90deg, #7bb08a, #5a9a6a);
}
.bar-fill.bad {
  background: linear-gradient(90deg, #b85040, #d04840);
}
.bar-fill.warn {
  background: linear-gradient(90deg, #c08a40, #d4a04a);
}

/* ============ 列表项 ============ */
.list-item {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border-2);
  position: relative;
}
.list-item:last-child { border-bottom: none; }

.li-title {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 13px;
  margin-bottom: 5px;
}

.li-name {
  font-weight: 700;
  color: var(--ink);
  font-size: 14px;
}

.li-name.self {
  color: var(--cinnabar);
}

.li-row2 {
  color: var(--ink-2);
  font-size: 11.5px;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.li-row3 {
  color: var(--ink-3);
  font-size: 11px;
  margin-top: 5px;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}

/* ============ 徽章 ============ */
.chip {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10.5px;
  font-weight: 600;
  background: rgba(90, 120, 90, 0.1);
  border: 1px solid var(--border);
  color: var(--ink-2);
  white-space: nowrap;
  letter-spacing: 0.3px;
}

.chip-jade {
  background: var(--jade-soft);
  border-color: rgba(90, 138, 106, 0.4);
  color: var(--jade-3);
}

.chip-cinnabar {
  background: var(--cinnabar-soft);
  border-color: rgba(184, 58, 48, 0.35);
  color: var(--cinnabar);
}

.chip-gold {
  background: var(--gold-soft);
  border-color: rgba(201, 169, 97, 0.4);
  color: #8a6a20;
}

.chip-wood {
  background: var(--wood-soft);
  border-color: rgba(168, 118, 58, 0.35);
  color: var(--wood);
}

/* 境界徽章 */
.rk {
  padding: 1px 8px;
  border-radius: 4px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.rk-0  { background: #e0e0e0; color: #666; }
.rk-1  { background: #d4e4ec; color: #3a5a72; }
.rk-2  { background: #c8e4d4; color: #2a5a3a; }
.rk-3  { background: #f4e4b8; color: #7a5a20; }
.rk-4  { background: #f0d4e4; color: #7a2a5a; }
.rk-5  { background: #f4c8c8; color: #7a2020; }
.rk-6  { background: #e0d4f0; color: #4a2a7a; }
.rk-7  { background: #f0d8c0; color: #7a4020; }
.rk-8  { background: #c4e8e4; color: #1a5a5a; }
.rk-9  { background: #f0ecc0; color: #5a5a10; }
.rk-10 { background: #e0d4f0; color: #4a2a7a; }
.rk-11 { background: #f4d0b0; color: #7a4510; }
.rk-12 { background: #b4e0dc; color: #0a4a4a; }
.rk-13 { background: #e8e8a0; color: #5a5a10; }
.rk-14 { background: #f0c0b0; color: #7a2010; }

/* 灵根颜色 */
.rt-金 { color: #8a6a20; font-weight: 600; }
.rt-木 { color: #3a6a3a; font-weight: 600; }
.rt-水 { color: #3a5a80; font-weight: 600; }
.rt-火 { color: #a04030; font-weight: 600; }
.rt-土 { color: #7a5a30; font-weight: 600; }
.rt-杂 { color: #7a7a7a; font-weight: 600; }

/* ============ 菜单卡 ============ */
.mc {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-3);
  background: rgba(255, 255, 255, 0.75);
  cursor: pointer;
  transition: 0.15s;
  margin-bottom: 8px;
  position: relative;
}
.mc:active:not(.locked) {
  background: var(--jade-soft);
  border-color: var(--border-hi);
  transform: scale(0.99);
}
.mc .mc-title {
  font-weight: 700;
  color: var(--jade-3);
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  letter-spacing: 0.5px;
}
.mc .mc-desc {
  color: var(--ink-2);
  font-size: 11.5px;
  margin-top: 4px;
  line-height: 1.55;
}
.mc .mc-foot {
  font-size: 11px;
  margin-top: 6px;
  color: var(--good);
  letter-spacing: 0.5px;
}
.mc .mc-foot.disabled {
  color: var(--ink-4);
}
.mc.locked {
  opacity: 0.45;
  cursor: not-allowed;
}

/* ============ 行样式（建筑行等） ============ */
.br {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-2);
}
.br:last-child { border-bottom: none; }

.br-info {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
}
.br-name {
  color: var(--ink);
  font-weight: 600;
}
.br-desc {
  color: var(--ink-3);
  font-size: 11px;
  margin-top: 3px;
}

/* ============ 空状态 ============ */
.empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--ink-4);
  font-size: 12.5px;
  line-height: 1.8;
}
.empty .em-title {
  color: var(--ink-3);
  font-size: 13px;
  margin-bottom: 6px;
}
</style>
<style>
/* ============ 模态弹窗 ============ */
.mo {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(20, 30, 20, 0.75);
  backdrop-filter: blur(8px) saturate(1.1);
  -webkit-backdrop-filter: blur(8px) saturate(1.1);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  padding-bottom: calc(16px + var(--safe-bottom));
  overflow-y: auto;
  animation: moIn 0.22s ease;
}

.mo.show { display: flex; }

@keyframes moIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.mo-card {
  background: #f8fbf8;
  background-image:
    radial-gradient(ellipse 400px 300px at 50% -20%, #e8f0e8 0%, transparent 70%);
  border: 1px solid var(--border-hi);
  border-radius: var(--r);
  padding: 22px 20px;
  max-width: 560px;
  width: 100%;
  box-shadow:
    0 20px 60px rgba(30, 60, 40, 0.25),
    0 0 0 1px rgba(90, 138, 106, 0.1);
  max-height: 90vh;
  overflow-y: auto;
  animation: moCardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
  position: relative;
}

.mo-card::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1px solid rgba(90, 138, 106, 0.12);
  border-radius: calc(var(--r) - 2px);
  pointer-events: none;
}

@keyframes moCardIn {
  from {
    opacity: 0;
    transform: translateY(20px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.mo-card h3 {
  color: var(--jade-3);
  font-size: 17px;
  margin-bottom: 14px;
  font-weight: 700;
  letter-spacing: 4px;
  text-align: center;
  position: relative;
  font-family: "STKaiti", "KaiTi", serif;
}

.mo-card h3::before,
.mo-card h3::after {
  content: '◆';
  color: rgba(90, 138, 106, 0.35);
  margin: 0 10px;
  font-size: 8px;
  vertical-align: middle;
}

.mo-sub {
  text-align: center;
  color: var(--ink-3);
  font-size: 11.5px;
  margin-top: -8px;
  margin-bottom: 14px;
  letter-spacing: 1px;
}

.mo-body {
  color: var(--ink);
  line-height: 1.85;
  font-size: 13.5px;
  margin-bottom: 18px;
  position: relative;
  padding: 0 4px;
}

.mo-body b {
  color: var(--jade-3);
  font-weight: 700;
}

.mo-body em {
  color: var(--cinnabar);
  font-style: normal;
  font-weight: 600;
}

.mo-body .mo-narrative {
  background: rgba(90, 138, 106, 0.06);
  border-left: 3px solid var(--jade);
  padding: 10px 12px;
  border-radius: 4px;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.9;
  margin: 10px 0;
}

.mo-body .mo-effect {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.mo-choices {
  display: flex;
  flex-direction: column;
  gap: 9px;
  position: relative;
}

.mo-choices button {
  padding: 13px 16px;
  text-align: left;
  font-size: 13px;

/* 挂载全部图标到页面 */
function mountAllIcons() {
  if (document.getElementById('icon-sprite-root')) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.id = 'icon-sprite-root';
  svg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden');
  svg.innerHTML = ICON_DEFS + ICON_DEFS_2;
  document.body.appendChild(svg);
}

/* 使用图标的帮助函数 */
function icon(id, size) {
  size = size || 16;
  return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" style="color:currentColor;vertical-align:middle"><use href="#ico-${id}"></use></svg>`;
}

/* 品阶对应的丹药图标 */
function pillIcon(tier) {
  tier = Math.min(9, Math.max(1, tier || 1));
  return icon('pill-t' + tier, 16);
}

/* 效果对应的丹药小图标 */
function pillEffectIcon(effect) {
  const map = {
    exp: 'pill-exp', br: 'pill-br', life: 'pill-life',
    cure: 'pill-cure', power: 'pill-power', talent: 'pill-talent',
    trib: 'pill-trib', poison: 'pill-poison',
    all: 'pill-talent', all2: 'pill-talent',
    wash: 'pill-talent', revive: 'pill-life',
    cure_demon: 'pill-cure', fertility: 'pill-life',
    fert_var: 'pill-life', beast_power: 'pill-power',
    beast_evolve: 'pill-talent'
  };
  const ico = map[effect] || 'pill-cure';
  return icon(ico, 12);
}

/* 灵植形状映射（按名称推断） */
function plantIcon(plant) {
  const n = plant.n || '';
  if (/花|莲|兰|荷|薇|蓉|梅/.test(n)) return icon('plant-flower', 16);
  if (/果|豆/.test(n)) return icon('plant-fruit', 16);
  if (/人参|参|根/.test(n)) return icon('plant-root', 16);
  if (/芝|叶|草|叶/.test(n)) return icon('plant-herb', 16);
  if (/藤|蔓|兰/.test(n)) return icon('plant-vine', 16);
  if (/树|木/.test(n)) return icon('plant-tree', 16);
  if (/莲/.test(n)) return icon('plant-lotus', 16);
  return icon('plant-herb', 16);
}

/* 灵兽形状映射（按 id 或名称推断） */
function beastIcon(beast) {
  const n = beast.n || '';
  if (/鹤|鸟|鹰|凤|乌|鸾|鹏/.test(n)) return icon('beast-bird', 16);
  if (/犬|狼|狐/.test(n)) return icon(/狐/.test(n) ? 'beast-fox' : 'beast-wolf', 16);
  if (/龙|蛟|蟒|蛇|婴/.test(n)) return icon('beast-dragon', 16);
  if (/麒麟|麟/.test(n)) return icon('beast-qilin', 16);
  if (/龟|精/.test(n)) return icon('beast-turtle', 16);
  if (/猿|猴/.test(n)) return icon('beast-ape', 16);
  if (/鹿|羊|獐/.test(n)) return icon('beast-deer', 16);
  if (/饕|凶/.test(n)) return icon('beast-taotie', 16);
  if (/虫|蜂/.test(n)) return icon('beast-insect', 16);
  if (/鲤|鱼|鲛/.test(n)) return icon('beast-fish', 16);
  if (/兔|狸/.test(n)) return icon('beast-wolf', 16);
  if (/马/.test(n)) return icon('beast-deer', 16);
  if (/鹏/.test(n)) return icon('beast-peng', 16);
  return icon('beast-wolf', 16);
}

/* 功法系别图标 */
function schoolIcon(school) {
  const map = {
    jian: 'school-jian',
    ti: 'school-ti',
    fa: 'school-fa',
    dan: 'school-dan',
    fu: 'school-fu',
    common: 'school-common'
  };
  return icon(map[school] || 'school-common', 14);
}

/* 根据描述推断法宝图标 */
function artifactIcon(artifact) {
  const n = artifact.name || '';
  if (/剑/.test(n)) return icon('art-sword', 16);
  if (/刀|刃|镰|匕首/.test(n)) return icon('art-blade', 16);
  if (/塔/.test(n)) return icon('art-tower', 16);
  if (/珠|环|镜/.test(n)) return /镜/.test(n) ? icon('art-bell', 16) : icon('art-orb', 16);
  if (/铃|钟/.test(n)) return icon('art-bell', 16);
  if (/旗|幡/.test(n)) return icon('art-banner', 16);
  if (/符|卷|书|经/.test(n)) return icon('art-scroll', 16);
  if (/甲|衣|袍|冠|履/.test(n)) return icon('art-armor', 16);
  if (/弓|箭|弩/.test(n)) return icon('art-bow', 16);
  if (/枪|戟|锤|斧/.test(n)) return icon('art-sword', 16);
  if (/拂尘|羽扇|玉笛|仙琴/.test(n)) return icon('art-banner', 16);
  if (/印|玉尺|铁笔|墨砚/.test(n)) return icon('art-scroll', 16);
  return icon('art-orb', 16);
}

<script>

 * 四十二、事件库 · 通用事件（不分层级）
 * 每项：id / w=权重 / title / desc / choices
 * choice: text / risk(稳|中|险) / run

/* 通用辅助函数：随机取族人 */
function pickRandomMember() {
  const pool = G.family.filter(p => p.realm >= 1 && p.age >= 12);
  return pool.length ? pick(pool) : null;
}

function pickRandomAdult() {
  const pool = G.family.filter(p => p.age >= 16 && p.age <= 70);
  return pool.length ? pick(pool) : null;
}

function randomGiven() {
  return pick(GIVN);
}

/* =====================================================
 * 通用事件（15 个）
 * ===================================================== */
const EVENTS_COMMON = [
  {
    id: 'c01', w: 6,
    title: '散修投靠',
    desc: '一落魄散修立于门外求见，自称略通武艺，愿投效家族。',
    choices: [
      { text: '收入门下（+1 族人，-50 灵石）', risk: 'mid',
        run: () => {
          if (G.stone < 50) { addLog('灵石不足，散修离去。', 'event'); return; }
          G.stone -= 50;
          const np = createPerson(genName(), {
            age: rnd(18, 40),
            talent: 0.4 + Math.random() * 0.35,
            realm: rnd(0, 1)
          });
          G.family.push(np);
          addLog(`散修【${np.name}】加入家族。`, 'good');
        }
      },
      { text: '赠粮遣走（+3 声望）', risk: 'low',
        run: () => {
          G.reputation += 3;
          addLog('家主赠散修粮米，以礼相送。', 'good');
        }
      },
      { text: '不予理会', risk: 'low',
        run: () => { addLog('散修见无人理会，怅然离去。', 'event'); }
      }
    ]
  },

  {
    id: 'c02', w: 5,
    title: '商队来访',
    desc: '一支商队路过，欲与家族做一笔买卖。',
    choices: [
      { text: '购入珍货（-80 灵石，得丹药）', risk: '稳',
        run: () => {
          if (G.stone < 80) { addLog('灵石不足。', 'event'); return; }
          G.stone -= 80;
          const pill = pick(PILLS.filter(p => p.t <= 2));
          G.pills[pill.id] = (G.pills[pill.id] || 0) + 1;
          addLog(`购得【${pill.n}】一枚。`, 'good');
        }
      },
      { text: '出售存货（+60 灵石）', risk: '稳',
        run: () => { G.stone += 60; addLog('出售家中余货，+60 灵石。', 'good'); }
      },
      { text: '婉拒离开', risk: '稳',
        run: () => { addLog('家主客气送走商队。', 'event'); }
      }

  },

    id: 'c03', w: 4,

    choices: [
      { text: '遣人探查（可能有机缘）', risk: '中',
        run: () => {
          if (chance(0.55)) {

            addLog(`家主探山，得【${ARTIFACT_TIERS[art.tier].n}·${art.name}】！`, 'special');
          } else {
            const p = pickRandomMember();
            if (p && chance(0.3)) {
              p.health = 'injured';
              p.injuredYears = 3;
              addLog(`${p.name} 探查途中受伤，需静养数年。`, 'bad');
            } else {

            }
          }
        }

/* =====================================================
 * 四十八、事件库整合：按境界分层
 * ===================================================== */
const EVENTS_BY_LEVEL = {
  common: EVENTS_COMMON,
  L1: EVENTS_L1,
  L2: EVENTS_L2,
  L3: EVENTS_L3,
  L4: EVENTS_L4,
  L5: EVENTS_L5
};

/* =====================================================
 * 四十九、根据家族最强者境界，选出当前层级的池子
 * ===================================================== */
function getCurrentEventPools() {
  let topRealm = G.player.realm;
  for (const p of G.family) {
    if (p.realm > topRealm) topRealm = p.realm;
  }

  const pools = [EVENTS_COMMON];
  if (topRealm >= 1) pools.push(EVENTS_L1);
  if (topRealm >= 2) pools.push(EVENTS_L2);
  if (topRealm >= 3) pools.push(EVENTS_L3);
  if (topRealm >= 4) pools.push(EVENTS_L4);
  if (topRealm >= 5) pools.push(EVENTS_L5);

  return pools;
}

/* 从符合条件的事件池里抽一个事件（避免重复，权重匹配） */
function pickOneEvent(pools) {
  const all = pools.flat();
  const total = all.reduce((s, e) => s + (e.w || 1), 0);
  let r = Math.random() * total;
  for (const e of all) {
    r -= (e.w || 1);
    if (r <= 0) return e;
  }
  return all[0];
}

/* 每年抽取 1-3 个事件（家族越大越多，最多 3 个） */
function rollYearEvents() {
  const pools = getCurrentEventPools();
  /* 家族规模影响事件数量 */
  const familySize = G.family.length + 1;
  let count = 1;
  if (familySize >= 8) count = 2;
  if (familySize >= 20) count = 3;
  /* 随机减少 */
  if (chance(0.2)) count = Math.max(1, count - 1);

  const events = [];
  const usedIds = new Set();
  for (let i = 0; i < count; i++) {
    let pickTry = 0;
    while (pickTry < 10) {
      const e = pickOneEvent(pools);
      if (!usedIds.has(e.id)) {
        usedIds.add(e.id);
        events.push(e);
        break;
      }
      pickTry++;
    }
  }
  return events;
}

<script>
/* =====================================================
 * 五十、NPC 势力常量
 * ===================================================== */

const NPC_NAMES = [
  '青云门',   '血煞宗',   '天剑阁',   '万兽谷',   '幻熙坊',
  '幽冥殿',   '太虚剑派', '百炼堂',   '丹霞谷',   '落霞谷',
  '星月楼',   '玉虚宫',   '玄冥殿',   '罗浮剑宗', '无极门',

  '九霄殿',   '万毒门',   '灵犀谷',   '天魔教',   '慈航庵',
  '寒月山庄', '沧澜书院', '铁剑山庄', '百草园',   '雷音寺'
];

const NPC_TYPES = ['宗门', '世家', '魔宗', '商盟', '散修', '妖修', '佛门'];

/* 势力初始感情池（用于随机初始化） */
const NPC_RELATION_POOL = [-60, -40, -20, -10, 0, 5, 15, 25, 40];

/* 势力等级（决定初始实力） */
const NPC_POWER_TIERS = [
  { name: '小宗',    base: 500,    variance: 800    },
  { name: '中宗',    base: 3000,   variance: 2000   },
  { name: '大宗',    base: 10000,  variance: 5000   },
  { name: '一流',    base: 30000,  variance: 15000  },
  { name: '顶级',    base: 80000,  variance: 40000  },
  { name: '圣地',    base: 200000, variance: 100000 }
];

/* =====================================================
 * 五十一、宗门任务系统
 * ===================================================== */

/* 生成一个宗门任务 */
function generateSectQuest() {
  /* 根据宗门等级挑选可用的任务类型 */
  const maxTypeRealm = Math.min(6, G.sectLevel + 1);
  const pool = SECT_QUEST_TYPES.filter(t => t.minRealm <= maxTypeRealm);
  const base = pick(pool);

  /* 难度随宗门等级提升 */
  const difficulty = clamp(1 + G.sectLevel * 0.15, 1, 3);
  /* 奖励 */
  const reward = Math.floor(base.baseReward * difficulty * (1 + Math.random() * 0.4));

  return {
    id: G.nextId++,
    typeId: base.id,
    typeName: base.n,
    difficulty: difficulty,
    reward: reward,
    danger: base.danger,
    minRealm: base.minRealm
  };
}

/* 每年刷新宗门任务列表（保留旧的未完成部分） */
function refreshSectQuests() {
  if (!G.isSect) return;
  /* 每年新增 1-2 个任务 */
  const newCount = rnd(1, 2);
  for (let i = 0; i < newCount; i++) {
    if (G.sectQuests.length >= 8) break;
    G.sectQuests.push(generateSectQuest());
  }
  /* 超过 8 个的自动清理最早的 */
  while (G.sectQuests.length > 10) {
    G.sectQuests.shift();
  }
}

/* 派遣一名弟子执行任务 */
function dispatchQuest(questId, personId) {
  const quest = G.sectQuests.find(q => q.id === questId);
  const person = getP(personId);
  if (!quest || !person) return { ok: false, msg: '任务或弟子不存在' };

  if (person.questActive) {
    return { ok: false, msg: `${person.name} 已有在身任务` };
  }
  if (person.realm < quest.minRealm) {
    return { ok: false, msg: `${person.name} 修为不足（需 ${REALMS[quest.minRealm].n}）` };
  }

  /* 标记进行中 */
  person.questActive = {
    questId: quest.id,
    startYear: G.year,
    duration: rnd(2, 5)
  };

  /* 移除任务，避免重复派发 */
  G.sectQuests = G.sectQuests.filter(q => q.id !== quest.id);
  return { ok: true, msg: `${person.name} 领命外出。` };
}

/* 每年检查进行中的任务是否完成 */
function processActiveQuests() {
  for (const p of G.family.slice()) {
    if (!p.questActive) continue;
    const qa = p.questActive;
    const elapsed = G.year - qa.startYear;
    if (elapsed < qa.duration) continue;

    /* 完成判定 */
    const successRate = clamp(0.55 + (p.talent - 0.5) * 0.3, 0.3, 0.92);
    if (chance(successRate)) {
      /* 成功 */
      p.sectContrib = (p.sectContrib || 0) + qa.reward || 10;
      addLog(`【${p.name}】任务归来，贡献点 +10。`, 'good');
    } else {
      /* 失败 */
      if (chance(0.4)) {
        /* 受伤 */
        p.health = 'injured';
        p.injuredYears = rnd(1, 3);
        addLog(`【${p.name}】任务受挫，负伤而归。`, 'bad');
      } else {
        addLog(`【${p.name}】任务未成，两手空空。`, 'event');
      }
    }
    p.questActive = null;
  }
}

/* =====================================================
 * 五十二、宗门贡献点系统
 * ===================================================== */

/* 给某人增加贡献点 */
function addContribution(person, amount) {
  if (!person) return;
  person.sectContrib = (person.sectContrib || 0) + amount;
}

/* 用贡献点兑换物品 */
function redeemContrib(personId, itemId) {
  const person = getP(personId);
  const item = CONTRIBUTION_SHOP.find(i => i.id === itemId);
  if (!person || !item) return { ok: false, msg: '参数错误' };

  const have = person.sectContrib || 0;
  if (have < item.cost) {
    return { ok: false, msg: `贡献点不足（需 ${item.cost}，现有 ${have}）` };
  }

  person.sectContrib -= item.cost;

  /* 应用奖励 */
  switch (item.type) {
    case 'tech': {
      const pool = TECHNIQUES.filter(t => t.t === item.tier && !G.techniqueIds.includes(t.id));
      if (pool.length) {
        const t = pick(pool);
        G.techniqueIds.push(t.id);
        return { ok: true, msg: `习得功法【${t.n}】` };
      }
      return { ok: true, msg: '已无可学功法，贡献点已退还' };
    }
    case 'artifact': {
      const art = rollArtifact(0.1 + item.tier * 0.05);
      art.tier = Math.max(item.tier, art.tier);
      person.artifacts = person.artifacts || [];
      person.artifacts.push(art);
      return { ok: true, msg: `得法宝【${ARTIFACT_TIERS[art.tier].n}·${art.name}】` };
    }
    case 'pill': {
      G.pills[item.pid] = (G.pills[item.pid] || 0) + 1;
      const pill = PILLS.find(p => p.id === item.pid);
      return { ok: true, msg: `得【${pill.n}】一枚` };
    }
  }
  return { ok: false, msg: '未知奖励类型' };
}

/* =====================================================
 * 五十三、宗门职位自动晋升
 * ===================================================== */

/* 计算某人应得的职位 */
function calcSectRank(person) {
  if (person.isPlayer) return { id: 99, n: '家主', perm: 'master' };
  let result = { id: 0, n: '外门弟子', perm: 'basic' };
  for (const r of SECT_RANKS) {
    if (person.realm >= r.minRealm) result = r;
  }
  return result;
}

/* 每年检查族中职位变更 */
function updateSectRanks() {
  if (!G.isSect) return;
  for (const p of G.family) {
    const newRank = calcSectRank(p);
    const oldRank = p.sectRank || '外门弟子';
    if (newRank.n !== oldRank) {
      p.sectRank = newRank.n;
      if (newRank.id >= 2) {
        addLog(`【${p.name}】晋升为${newRank.n}。`, 'good');
      }
    }
  }
}

/* =====================================================
 * 五十四、宗门每年自动招人
 * ===================================================== */

function autoRecruitDisciples() {
  if (!G.isSect) return;
  /* 招人数量：1-3 个（随等级提升） */
  const count = rnd(1, Math.min(3, 1 + Math.floor(G.sectLevel / 2)));
  /* 宗门人数上限 */
  const maxMembers = SECT_LEVELS[G.sectLevel].maxMembers;
  const currentCount = G.family.length + 1;
  if (currentCount >= maxMembers) return;

  const available = maxMembers - currentCount;
  const realCount = Math.min(count, available);

  for (let i = 0; i < realCount; i++) {
    /* 弟子天赋 随等级提升 */
    const talentBase = 0.35 + G.sectLevel * 0.05;
    const np = createPerson(genName(), {
      age: rnd(16, 30),
      talent: clamp(talentBase + Math.random() * 0.3, 0.3, 1),
      realm: Math.max(0, Math.floor(G.sectLevel / 2) - 1),
      personalityId: pick(PERSONALITIES).id,
      bloodlineId: 'none'
    });
    np.sectRank = '外门弟子';
    np.isSectMember = true;
    G.family.push(np);

    /* 每年只在日志里合并输出 */
  }
  if (realCount > 0) {
    addLog(`宗门今年招收弟子 ${realCount} 人。`, 'event');
  }
}

/* =====================================================
 * 五十五、宗门晋升检测
 * ===================================================== */

/* 检查是否有资格晋升宗门等级 */
function canSectLevelUp() {
  const next = SECT_LEVELS[G.sectLevel + 1];
  if (!next) return { can: false, reason: '已达最高等级' };

  /* 条件：家族最强者达到境界需求 */
  let topRealm = G.player.realm;
  for (const p of G.family) {
    if (p.realm > topRealm) topRealm = p.realm;
  }

  if (topRealm < next.needRealm) {
    return {
      can: false,
      reason: `需有人达【${REALMS[next.needRealm].n}】（当前家族最强 ${REALMS[topRealm].n}）`
    };
  }

  return { can: true, next: next };
}

/* 执行宗门晋升 */
function doSectLevelUp() {
  const chk = canSectLevelUp();
  if (!chk.can) return;
  G.sectLevel++;
  const lv = SECT_LEVELS[G.sectLevel];

  addLog(`✦✦ 宗门晋升为【${lv.n}】！${lv.desc}`, 'special');
  G.history.push({ y: G.year, t: `宗门晋升为【${lv.n}】。` });

  /* 全系统升级奖励 */
  G.buildings.farm = (G.buildings.farm || 0) + 1;
  G.buildings.library = (G.buildings.library || 0) + 1;
  G.buildings.pill = (G.buildings.pill || 0) + 1;

  /* 声望奖励 */
  G.reputation += lv.id * 200 + 300;

  /* 刷新可解锁内容 */
  refreshUnlockablesBySectLevel();
}

/* 宗门晋升后，解锁一些高级丹药/灵植/灵兽 */
function refreshUnlockablesBySectLevel() {
  const lv = SECT_LEVELS[G.sectLevel];
  /* 达到 pillTier 的丹药自动加入研发列表 */
  PILLS.forEach(p => {
    if (p.t <= lv.pillTier && !G.pillRecipes.includes(p.id) && chance(0.4)) {
      G.pillRecipes.push(p.id);
    }
  });
}
</script>
<script>
/* =====================================================
 * 五十六、人物创建与灵根系统
 * ===================================================== */

/* 随机灵根：从 1 灵根到 5 灵根 */
function rollRoot() {
  const r = Math.random();
  const cnt = r < 0.04 ? 1
            : r < 0.22 ? 2
            : r < 0.55 ? 3
            : r < 0.82 ? 4
            : 5;

  /* 从五行里随机抽 cnt 个不同的 */
  const pool = shuffle(EL.slice());
  const root = {};
  for (let i = 0; i < cnt; i++) {
    root[pool[i]] = +(0.4 + Math.random() * 0.6).toFixed(2);
  }
  return root;
}

/* 灵根品质系数（0 - 1.9 之间） */
function rootQuality(root) {
  const els = Object.keys(root);
  const cm = RCM[els.length] || 0.6;
  const avg = els.reduce((s, e) => s + root[e], 0) / els.length;
  return cm * avg;
}

/* 灵根文字描述 */
function rootLabel(root) {
  const els = Object.keys(root);
  if (els.length >= 5) return '五行杂灵根';
  if (els.length === 1) return els[0] + '天灵根';
  if (els.length === 2) return els.join('') + '双灵根';
  return els.join('') + '灵根';
}

/* 灵根 CSS 类名 */
function rootClass(root) {
  const els = Object.keys(root);
  if (els.length >= 5) return 'rt-杂';
  return 'rt-' + els[0];
}

/* 灵根品质文字（用于雷达图下方） */
function rootTierText(root) {
  const els = Object.keys(root);
  const counts = els.length;
  let tier = '';
  if (counts === 1) tier = '天灵根 · 极品';
  else if (counts === 2) tier = '双灵根 · 优品';
  else if (counts === 3) tier = '三灵根 · 常品';
  else if (counts === 4) tier = '四灵根 · 下品';
  else tier = '五行杂灵根 · 凡品';
  return tier;
}

/* =====================================================
 * 五十七、生成姓名（必须跟家主姓）
 * ===================================================== */

/* 家族姓氏：从家主名字取第一个字 */
function getFamilySurname() {
  if (!G || !G.player) return '陈';
  return G.player.name ? G.player.name[0] : '陈';
}

/* 生成家族子弟的名字 */
function genName() {
  if (!G) return pick(SURN) + pick(GIVN);
  const surname = getFamilySurname();
  for (let i = 0; i < 60; i++) {
    const n = surname + pick(GIVN);
    if (!G.family.some(p => p.name === n) && G.player.name !== n) return n;
  }
  /* 重名太多，加一字 */
  return surname + pick(GIVN) + pick(GIVN);
}

/* 生成外姓人的名字（散修、弟子等） */
function genForeignName() {
  if (!G) return pick(SURN) + pick(GIVN);
  for (let i = 0; i < 60; i++) {
    const n = pick(SURN) + pick(GIVN);
    if (!G.family.some(p => p.name === n) && G.player.name !== n) return n;
  }
  return pick(SURN) + pick(GIVN) + rnd(2, 9);
}

/* =====================================================
 * 五十八、创建人物
 * ===================================================== */

function createPerson(name, opts) {
  opts = opts || {};
  return {
    /* 基础 */
    id: G.nextId++,
    name: name,
    age: opts.age != null ? opts.age : rnd(16, 26),
    gender: opts.gender || (chance(0.5) ? 'M' : 'F'),

    /* 修为 */
    realm: opts.realm || 0,
    sub: opts.sub || 0,
    exp: opts.exp || 0,

    /* 资质 */
    root: opts.root || rollRoot(),
    talent: opts.talent != null ? opts.talent : 0.4 + Math.random() * 0.5,

    /* 血脉与性格 */
    bloodlineId: opts.bloodlineId || (G.bloodlineId || 'none'),
    personalityId: opts.personalityId || pick(PERSONALITIES).id,

    /* 家族关系 */
    fatherId: opts.fatherId || null,
    motherId: opts.motherId || null,
    spouseIds: opts.spouseIds ? opts.spouseIds.slice() : [],

    /* 法宝与功法 */
    artifacts: opts.artifacts || [],
    techniques: opts.techniques || [],
    lifeBound: null,

    /* 宗门身份 */
    isSectMember: !!opts.isSectMember,
    sectRank: opts.sectRank || null,
    sectContrib: 0,
    questActive: null,

    /* 状态 */
    isPlayer: !!opts.isPlayer,
    extraLife: 0,
    powerBonus: 0,

    /* 突破丹药临时加成 */
    pillBreakRealm: -1,
    curPillBreak: 0,

    /* 心魔状态 */
    demon: 0,

    /* 受伤 / 生病 */
    health: null,
    injuredYears: 0,
    sickYears: 0,

    /* 忠诚标记 */
    loyalBonus: 0,

    /* 阵亡标记 */
    _dead: false
  };
}

/* 通过 id 找人 */
function getP(id) {
  if (G.player && G.player.id === id) return G.player;
  return G.family.find(p => p.id === id) || null;
}

/* =====================================================
 * 五十九、数值计算
 * ===================================================== */

/* 血脉配置 */
function getBL(p) {
  if (!p) return BLOODLINES.find(b => b.id === 'none');
  return BLOODLINES.find(b => b.id === p.bloodlineId) || BLOODLINES.find(b => b.id === 'none');
}

/* 性格配置 */
function getPer(p) {
  if (!p) return PERSONALITIES[0];
  return PERSONALITIES.find(x => x.id === p.personalityId) || PERSONALITIES[0];
}

/* 家训配置 */
function getRule() {
  if (!G) return FAMILY_RULES[0];
  return FAMILY_RULES.find(r => r.id === G.familyRule) || FAMILY_RULES[0];
}

/* 难度配置 */
function getDiff() {
  if (!G) return DIFFICULTIES[1];
  return DIFFICULTIES.find(d => d.id === G.difficulty) || DIFFICULTIES[1];
}

/* 时代配置 */
function getEra() {
  if (!G) return ERAS[0];
  return ERAS.find(e => e.id === G.era) || ERAS[0];
}

/* 灵域配置 */
function getRegion() {
  if (!G) return REGIONS[4];
  return REGIONS.find(r => r.id === G.region) || REGIONS[4];
}

/* ---------------------------------------------
 * 寿元上限
 * --------------------------------------------- */
function lifeMax(p) {
  if (!p) return 80;
  const base = REALMS[p.realm].l;
  const pillBonus = Math.floor(base * (G.buildings.pill || 0) * 0.05)
                  + (G.buildings.pill || 0) * 30;
  const techLife = techB(p, 'lf');
  const bl = getBL(p);
  const blLife = bl.life || 0;
  const per = getPer(p);
  const perLife = per.life || 0;
  const cemBonus = (G.cemeteryBonus || 0) * 0.01;
  const legBonus = applyLegacy().life;
  return Math.floor(
    (base + pillBonus) *
    (1 + techLife + blLife + perLife + cemBonus + legBonus)
  ) + (G.buildings.spring || 0) * 8 + (p.extraLife || 0);
}

/* ---------------------------------------------
 * 修为需求
 * --------------------------------------------- */
function expNeed(p) {
  if (!p) return 60;
  return REALMS[p.realm].e;
}

/* ---------------------------------------------
 * 功法属性累加
 * --------------------------------------------- */
function techB(p, key) {
  if (!p || !p.techniques || !p.techniques.length) return 0;
  let s = 0;
  for (const tid of p.techniques) {
    const t = TECHNIQUES.find(x => x.id === tid);
    if (t && t[key]) s += t[key];
  }
  return s;
}

/* ---------------------------------------------
 * 每一年获得的修为
 * 修为自动涨 = 20% 的主动修炼速度
 * --------------------------------------------- */
function expGain(p) {
  if (!p) return 1;
  const base = 10 * Math.pow(3.2, p.realm);
  const tal = 0.4 + p.talent * 1.2;
  const rq = rootQuality(p.root);
  const artSum = (p.artifacts || []).reduce((s, a) => s + a.e, 0);
  const techExp = techB(p, 'e');
  const lib = 1 + (G.buildings.library || 0) * 0.08;
  const pill = 1 + (G.buildings.pill || 0) * 0.06;
  const rep = 1 + Math.min((G.reputation || 0) / 2000, 0.4);
  const bl = getBL(p).e;
  const per = getPer(p).e;
  const rule = getRule().eff.exp || 1;
  const cave = 1 + (G.buildings.cave || 0) * 0.03 + (G.buildings.spring || 0) * 0.04;
  const academy = 1 + (G.buildings.academy || 0) * 0.05;
  const sect = G.isSect ? (SECT_LEVELS[G.sectLevel]?.e || 1) * 1.0 : 1;
  const leg = 1 + applyLegacy().cult;

  /* 受伤 / 生病影响 */
  const healthMod = p.health ? 0.4 : 1;

  /* 自动修炼 = 20% 主动速度（保留 80% 给玩家的选择）*/
  return Math.max(1, Math.floor(
    base * tal * rq *
    (1 + artSum) * (1 + techExp) *
    lib * pill * rep *
    bl * per * rule *
    cave * academy * sect * leg *
    healthMod *
    0.2
  ));
}

/* ---------------------------------------------
 * 战力
 * --------------------------------------------- */
function power(p) {
  if (!p) return 0;
  const lvl = p.realm * 3 + p.sub;
  const base = Math.pow(1.85, lvl);
  const tal = 0.5 + p.talent;
  const rq = rootQuality(p.root);
  const artP = (p.artifacts || []).reduce((s, a) => s + a.p, 0);
  const techP = techB(p, 'p');
  const bl = getBL(p).p;
  const per = getPer(p).p;
  const rule = getRule().eff.power || 1;
  const beastP = (G.beasts || []).reduce((s, b) => s + b.p, 0);
  const lbP = p.lifeBound ? p.lifeBound.p * 0.8 : 0;
  const pBonus = 1 + (p.powerBonus || 0);
  const barracks = 1 + (G.buildings.barracks || 0) * 0.03;
  const leg = 1 + applyLegacy().battle;

  /* 受伤减半 */
  const healthMod = p.health ? 0.5 : 1;

  return Math.floor(
    base * tal * rq *
    (1 + artP * 0.02) *
    (1 + techP) *
    bl * per * rule *
    pBonus * barracks * leg *
    healthMod * 10
  ) + Math.floor(beastP / 4) + lbP;
}

/* 全家族战力 */
function familyPower() {
  if (!G) return 0;
  return G.family.reduce((s, p) => s + power(p), 0)
    + power(G.player)
    + (G.beasts || []).reduce((s, b) => s + b.p, 0);
}

/* ---------------------------------------------
 * 境界文字
 * --------------------------------------------- */
function realmLabel(p) {
  if (!p || p.realm === 0) return '凡人';
  return REALMS[p.realm].n + '·' + SUBS[p.sub];
}

/* 学习功法 */
function learnTech(p, tid) {
  const t = TECHNIQUES.find(x => x.id === tid);
  if (!t) return;
  if (!p.techniques) p.techniques = [];
  if (p.techniques.includes(tid)) return;
  if (p.techniques.length >= 3) return;
  p.techniques.push(tid);
}

/* ---------------------------------------------
 * 应用跨局底蕴加成
 * --------------------------------------------- */
function applyLegacy() {
  const u = LEGACY.upgrades || {};
  return {
    life:     (u.lifespan || 0) * 0.03,
    cult:     (u.cultivate || 0) * 0.05,
    stone:    (u.startStone || 0) * 200,
    talent:   (u.startTalent || 0) * 0.03,
    family:   u.startFamily || 0,
    battle:   (u.battle || 0) * 0.05,
    qiyun:    (u.qiyun || 0) * 0.10,
    tech:     u.techUnlock || 0
  };
}

/* =====================================================
 * 六十、突破概率
 * ===================================================== */

/* 简版：返回最终值 */
function breakRate(p) {
  return breakRateDetail(p).final;
}

/* 详版：返回每一项拆解 */
function breakRateDetail(p) {
  const base = 0.40;
  const tal = 0.5 + p.talent;
  const rq = rootQuality(p.root);
  const lib = 1 + (G.buildings.library || 0) * 0.10;
  const artB = (p.artifacts || []).reduce((s, a) => s + a.b, 0);
  const techBreak = techB(p, 'b');
  /* 高境界惩罚 */
  const pen = Math.pow(0.93, p.realm);
  const bl = getBL(p).b;
  const per = getPer(p).b;
  const stoneSite = 1 + (G.buildings.stoneSite || 0) * 0.02;
  const diff = getDiff().br;
  const lifeBound = p.lifeBound ? p.lifeBound.b * 0.5 : 0;

  /* 突破丹临时加成 */
  let pillBonus = 0;
  if (p.pillBreakRealm === p.realm && p.curPillBreak > 0) {
    pillBonus = p.curPillBreak;
  }

  /* 心魔惩罚 */
  const demonPenalty = p.demon > 0 ? 0.5 : 1;

  /* 修为积累加成：修满 100% = 0；满 200% = +0.2 */
  let expBonus = 0;
  const need = expNeed(p);
  if (p.exp >= need) {
    const overflow = Math.min(1, (p.exp - need) / need);
    expBonus = overflow * 0.2;
  }

  const raw =
    base * tal * rq * lib *
    (1 + artB) * (1 + techBreak) *
    pen * bl * per * stoneSite * diff * demonPenalty;

  const final = clamp(raw + pillBonus + lifeBound + expBonus, 0.02, 0.95);

  return {
    final: final,
    base: base,
    talent: tal,
    root: rq,
    library: lib,
    artifact: 1 + artB,
    technique: 1 + techBreak,
    penalty: pen,
    bloodline: bl,
    personality: per,
    stoneSite: stoneSite,
    difficulty: diff,
    demon: demonPenalty,
    pill: pillBonus,
    lifeBound: lifeBound,
    expBonus: expBonus
  };
}
</script>
<script>
/* =====================================================
 * 六十一、突破系统
 * 小境界直接突破；大境界必渡天劫
 * ===================================================== */

/* 判断当前突破是否为"大境界"（需渡天劫） */
function isBigBreakthrough(p) {
  if (!p) return false;
  /* 修为满大圆满，且下一境界在 TRIBULATION_REALMS 中 */
  if (p.sub !== SUBS.length - 1) return false;
  const nextRealm = p.realm + 1;
  return TRIBULATION_REALMS.includes(nextRealm);
}

/* 普通小境界突破：不渡天劫 */
function doSmallBreakthrough(p, isPlayer) {
  const oldR = realmLabel(p);
  if (p.sub < SUBS.length - 1) {
    p.sub++;
  } else {
    p.realm++;
    p.sub = 0;
  }
  p.exp = 0;
  p.curPillBreak = 0;
  p.pillBreakRealm = -1;

  const tag = isPlayer ? '✦ 家主' : '✦';
  addLog(`${tag} ${p.name} 突破【${oldR}】→【${realmLabel(p)}】！`, 'good');

  /* 高境界记录史册 */
  if (p.realm === 4 && isPlayer) {
    G.history.push({ y: G.year, t: `家主突破元婴期，家族气象大变！` });
  }
  if (p.realm === 5 && !isPlayer) {
    G.history.push({ y: G.year, t: `家族诞生第一位化神修士——${p.name}。` });
  }
}

/* 大境界突破：需渡天劫 */
function startBigBreakthrough(p, isPlayer) {
  const targetRealm = p.realm + 1;
  const rate = tribRate(p);
  const tp = PILLS.find(x => x.id === 'tb');
  const canPill = (G.pills['tb'] || 0) > 0;

  /* 玩家手动触发弹窗 */
  if (isPlayer) {
    UI.decisionQueue.push({
      title: '⚡ 天劫降临',
      sub: `${p.name} · ${realmLabel(p)} → ${REALMS[targetRealm].n}初期`,
      desc: `
        <div class="mo-narrative">
          乌云压顶，雷蛇乱舞。<br>
          家主修为已至${realmLabel(p)}大圆满，欲破境而入【${REALMS[targetRealm].n}】，<br>
          必渡天劫。<br><br>
          成功率：<b>${(rate * 100).toFixed(0)}%</b><br>
          渡劫准备度：${G.tribulationGear}
        </div>
      `,
      choices: [
        {
          text: '立即渡劫',
          risk: '险',
          run: () => executeTribulation(p, targetRealm)
        },
        canPill ? {
          text: '服用【天劫丹】（+15%）',
          risk: '中',
          run: () => {
            G.pills['tb']--;
            executeTribulation(p, targetRealm);
          }
        } : null,
        {
          text: '暂缓渡劫，再积蓄几年',
          risk: '稳',
          run: () => {
            addLog('家主暂缓渡劫，继续积蓄修为。', 'event');
          }
        }
      ].filter(Boolean),
      isTribulation: true
    });
    showNextDecision();
  } else {
    /* NPC 自动判定 */
    const npcRate = clamp(0.4, rate, 0.9);
    if (chance(npcRate)) {
      doBigBreakthroughSuccess(p, targetRealm, false);
    } else {
      doBigBreakthroughFailure(p, false);
    }
  }
}

/* 执行天劫 */
function executeTribulation(p, targetRealm) {
  const rate = tribRate(p);
  G.tribulationGear = 0;

  addLog('⚡ 雷云滚滚，天劫将至……', 'special');

  if (chance(rate)) {
    doBigBreakthroughSuccess(p, targetRealm, true);
  } else {
    doBigBreakthroughFailure(p, true);
  }
}

/* 渡劫成功 */
function doBigBreakthroughSuccess(p, targetRealm, isPlayer) {
  p.realm = targetRealm;
  p.sub = 0;
  p.exp = 0;
  p.curPillBreak = 0;
  p.pillBreakRealm = -1;

  G.reputation += 50 * targetRealm;
  G.stone += rnd(200, 800) * targetRealm;

  if (isPlayer) {
    addLog(`✦✦ 渡劫成功！家主晋升【${realmLabel(p)}】！`, 'special');
    G.history.push({ y: G.year, t: `家主渡劫成功，晋升 ${REALMS[targetRealm].n}。` });
  } else {
    addLog(`✦ ${p.name} 渡过天劫，晋升【${realmLabel(p)}】！`, 'special');
    G.history.push({ y: G.year, t: `${p.name} 渡劫成功，晋升 ${REALMS[targetRealm].n}。` });
  }

  /* 更新本命法宝 */
  updateLifeBounds();

  /* 根据新等级触发宗门晋升检查 */
  checkSectPromotion();
}

/* 渡劫失败 */
function doBigBreakthroughFailure(p, isPlayer) {
  /* 三种失败后果 */
  const r = Math.random();
  if (r < 0.35) {
    /* 身死道消 */
    if (isPlayer) {
      addLog('✖ 渡劫失败！家主身死道消！', 'bad');
      p.age = lifeMax(p) + 1;
      /* 触发家主继任 */
      handlePlayerDeath();
    } else {
      p._dead = true;
      addLog(`✖ ${p.name} 渡劫失败，形神俱灭。`, 'bad');
      G.history.push({ y: G.year, t: `${p.name} 渡劫失败陨落。` });
    }
  } else if (r < 0.7) {
    /* 重伤 */
    p.health = 'injured';
    p.injuredYears = rnd(3, 6);
    const loss = Math.floor(p.exp * 0.5);
    p.exp = Math.max(0, p.exp - loss);
    p.sub = Math.max(0, p.sub - 1);
    addLog(`✖ ${p.name} 渡劫失败，重伤而归，修为倒退。`, 'bad');
  } else {
    /* 轻伤 */
    const loss = Math.floor(p.exp * 0.3);
    p.exp = Math.max(0, p.exp - loss);
    addLog(`✖ ${p.name} 天劫未过，幸保一命，损失修为 ${fmt(loss)}。`, 'bad');
  }
}

/* ---------------------------------------------
 * 天劫成功率
 * --------------------------------------------- */
function tribRate(p) {
  const base = 0.75;
  const pen = Math.pow(0.93, p.realm);
  const prep = Math.min(0.25, (G.tribulationGear || 0) * 0.05);
  const altar = Math.min(0.25, (G.buildings.altar || 0) * 0.05);
  const tal = (p.talent - 0.5) * 0.35;
  const bl = getBL(p).b - 1;
  const art = (p.artifacts || []).reduce((s, a) => s + a.tier * 0.02, 0);
  const lb = p.lifeBound ? p.lifeBound.tier * 0.03 : 0;
  let pillBonus = 0;
  if ((G.pills['tb'] || 0) > 0) pillBonus = 0.15;

  return clamp(
    base * pen + prep + altar + tal + bl + art + lb + pillBonus,
    0.05, 0.95
  );
}

/* 筹备渡劫（增加准备度） */
function tribPrep() {
  const cost = 200 + (G.tribulationGear || 0) * 100;
  if (G.stone < cost) {
    addLog(`筹备渡劫需 ${fmt(cost)} 灵石。`, 'bad');
    return;
  }
  if ((G.tribulationGear || 0) >= 5) {
    addLog('渡劫准备度已满。', 'bad');
    return;
  }
  G.stone -= cost;
  G.tribulationGear = (G.tribulationGear || 0) + 1;
  addLog(`家主筹备渡劫（准备度 ${G.tribulationGear}）。`, 'good');
}

/* 本命法宝随境界进化 */
function updateLifeBounds() {
  const all = [G.player].concat(G.family);
  for (const p of all) {
    if (!p.lifeBound) continue;
    const newTier = Math.min(5, Math.max(1, Math.floor(p.realm / 2)));
    if (newTier > p.lifeBound.tier) {
      p.lifeBound.tier = newTier;
      p.lifeBound.e = +(ARTIFACT_TIERS[newTier].e * 1.3).toFixed(3);
      p.lifeBound.b = +(ARTIFACT_TIERS[newTier].b * 1.3).toFixed(3);
      p.lifeBound.p = Math.floor(ARTIFACT_TIERS[newTier].p * 1.5);
      addLog(`✦ ${p.name} 的本命法宝进化！`, 'good');
    }
  }
}

/* =====================================================
 * 六十二、生育与血脉遗传
 * ===================================================== */

/* 生育率：随母亲 / 家族成员境界降低，但永不为 0 */
function getFertilityRate(realm) {
  /* 凡人 8% → 练气 5% → 筑基 3% → 结丹 1.5% → 元婴 0.8% → 化神 0.4% → 更高 0.2% */
  const table = [0.08, 0.05, 0.03, 0.015, 0.008, 0.004, 0.002, 0.0015, 0.0012, 0.001];
  return table[Math.min(realm, table.length - 1)];
}

/* 天骄概率：随父母最高境界提升 */
function getProdigyChance(realm) {
  /* 凡人 0.5% → 练气 1% → 筑基 2% → 结丹 4% → 元婴 7% → 化神 12% → 越高越高 */
  const table = [0.005, 0.01, 0.02, 0.04, 0.07, 0.12, 0.18, 0.25, 0.30, 0.35];
  return table[Math.min(realm, table.length - 1)];
}

/* 天赋继承：父母平均 + 随机扰动 */
function inheritTalent(a, b, isProdigy) {
  let base = (a.talent + b.talent) / 2 + (Math.random() - 0.5) * 0.25;
  if (isProdigy) {
    base = Math.max(base, 0.85 + Math.random() * 0.15);
  }
  return clamp(base, 0.05, 1);
}

/* 灵根继承 */
function inheritRoot(a, b) {
  const r = Math.random();
  if (r < 0.45) {
    /* 完全继承父或母 */
    const src = chance(0.5) ? a.root : b.root;
    const root = {};
    Object.keys(src).forEach(e => {
      root[e] = +clamp(src[e] + (Math.random() - 0.5) * 0.15, 0.1, 1).toFixed(2);
    });
    return root;
  } else if (r < 0.9) {
    /* 随机重新抽取 */
    return rollRoot();
  } else {
    /* 反祖：比父母都好 */
    return { [pick(EL)]: +(0.85 + Math.random() * 0.15).toFixed(2) };
  }
}

/* 血脉继承 */
function inheritBloodline(a, b) {
  const r = Math.random();
  if (r < 0.5 && a.bloodlineId) return a.bloodlineId;
  if (r < 0.8 && b.bloodlineId) return b.bloodlineId;
  /* 20% 觉醒家族血脉 */
  return G.bloodlineId || 'none';
}

/* 近亲检查：三代以内 */
function isCloseKin(a, b) {
  const pa = [a.fatherId, a.motherId].filter(Boolean);
  const pb = [b.fatherId, b.motherId].filter(Boolean);
  for (const x of pa) if (pb.includes(x)) return true;
  if (a.fatherId === b.id || a.motherId === b.id) return true;
  if (b.fatherId === a.id || b.motherId === a.id) return true;
  return false;
}

/* 生成一个婴儿 */
function makeBaby(father, mother) {
  const maxRealm = Math.max(father.realm, mother.realm);
  const isProdigy = chance(getProdigyChance(maxRealm));
  const gender = chance(0.5) ? 'M' : 'F';

  const baby = createPerson(genName(), {
    age: 0,
    gender: gender,
    fatherId: father.id,
    motherId: mother.id,
    talent: inheritTalent(father, mother, isProdigy),
    root: inheritRoot(father, mother),
    bloodlineId: inheritBloodline(father, mother)
  });

  if (isProdigy) {
    baby.isProdigy = true;
    addLog(`★★ 天骄【${baby.name}】降生！天赋 ${baby.talent.toFixed(2)}，灵根 ${rootLabel(baby.root)}！`, 'special');
    G.history.push({ y: G.year, t: `家族诞生天骄 ${baby.name}，天赋超绝。` });
  }

  return baby;
}

/* 每年生育判定 */
function processBirth() {
  /* ---- 家主的道侣 ---- */
  if (G.player.age >= 20 && G.player.age <= 70) {
    for (const sid of (G.player.spouseIds || [])) {
      const sp = getP(sid);
      if (!sp || sp.age < 20 || sp.age > 70) continue;
      if (sp.health) continue; /* 生病 / 受伤时暂不生育 */

      /* 基础生育率取夫妻最高境界 */
      const maxRealm = Math.max(G.player.realm, sp.realm);
      let rate = getFertilityRate(maxRealm);
      /* 难度系数 */
      rate *= getDiff().fert;
      /* 家训加成 */
      rate *= getRule().eff.fertility || 1;
      /* 丹药加成 */
      if ((G.pills['at'] || 0) > 0 && chance(0.3)) {
        G.pills['at']--;
        rate *= 2; /* 安胎丹翻倍 */
      }
      if ((G.pills['yl'] || 0) > 0 && chance(0.2)) {
        G.pills['yl']--;
        rate *= 1.5;
      }

      if (chance(rate)) {
        const baby = makeBaby(G.player, sp);
        G.family.push(baby);
        if (!baby.isProdigy) {
          addLog(`✦ ${sp.name} 为家主诞下子嗣【${baby.name}】。`, 'good');
        }
      }
    }
  }

  /* ---- 家族内部夫妻 ---- */
  const seen = new Set();
  const snap = G.family.slice();
  for (const p of snap) {
    if (!p.spouseIds || !p.spouseIds.length) continue;
    if (p.age < 20 || p.age > 70) continue;
    if (p.health) continue;

    for (const sid of p.spouseIds) {
      const mate = getP(sid);
      if (!mate || mate.age < 20 || mate.age > 70) continue;
      if (mate.health) continue;

      const key = Math.min(p.id, mate.id) + '-' + Math.max(p.id, mate.id);
      if (seen.has(key)) continue;
      seen.add(key);
      if (isCloseKin(p, mate)) continue;

      const maxRealm = Math.max(p.realm, mate.realm);
      let rate = getFertilityRate(maxRealm) * getDiff().fert * (getRule().eff.fertility || 1);

      if (chance(rate)) {
        const baby = makeBaby(p, mate);
        G.family.push(baby);
      }
    }
  }
}

/* =====================================================
 * 六十三、洗灵根
 * ===================================================== */
function washRoot(p) {
  const els = Object.keys(p.root);
  if (els.length <= 1) {
    addLog(`${p.name} 灵根已至极致，无需洗炼。`, 'event');
    return;
  }
  /* 保留主属性，去杂 */
  const main = els.sort((a, b) => p.root[b] - p.root[a])[0];
  const newRoot = {};
  newRoot[main] = +Math.min(1.0, p.root[main] + 0.15).toFixed(2);
  p.root = newRoot;
  addLog(`✦ ${p.name} 洗炼灵根成功，转为【${rootLabel(newRoot)}】！`, 'special');
}

/* =====================================================
 * 六十四、心魔化解
 * ===================================================== */
function cureDemon(p) {
  if (!p.demon) return false;
  p.demon = 0;
  return true;
}
</script>
<script>
/* =====================================================
 * 六十五、年度推进主循环
 * ===================================================== */

/* 玩家点击「度岁」时触发（悬浮按钮） */
function doNextYear() {
  if (G.over || UI.modalOpen) return;

  /* 选年数（1-20 或 5） */
  const years = UI.selectedYears || 5;

  /* 逐个年份处理 */
  let processed = 0;
  for (let y = 0; y < years; y++) {
    if (G.over) break;

    /* 弹事件处理完再进下一年 */
    const hadDecision = advanceOneYear();
    processed++;

    /* 若本年触发了弹窗，暂停后续年的推进 */
    if (hadDecision) break;
  }

  render();

  /* 若玩家选多年，自动推进剩余年份 */
  if (processed < years && !G.over && !UI.modalOpen) {
    setTimeout(() => {
      if (!G.over && !UI.modalOpen) {
        UI.remainingYears = years - processed;
        continueAdvance();
      }
    }, 400);
  }
}

/* 继续推进剩余的年份 */
function continueAdvance() {
  while ((UI.remainingYears || 0) > 0 && !G.over && !UI.modalOpen) {
    UI.remainingYears--;
    const hadDecision = advanceOneYear();
    if (hadDecision) {
      /* 有弹窗处理完后再继续 */
      setTimeout(() => {
        if (!G.over && !UI.modalOpen) continueAdvance();
      }, 400);
      render();
      return;
    }
  }
  UI.remainingYears = 0;
  render();
}

/* =====================================================
 * 推进一年（核心）
 * 返回 true 表示本年触发了需要玩家处理的弹窗
 * ===================================================== */
function advanceOneYear() {
  /* 1. 年份 +1 */
  G.year++;
  G.player.age++;

  /* 2. 家主寿元检测 */
  if (G.player.age >= lifeMax(G.player)) {
    handlePlayerDeath();
    return true;
  }

  /* 3. 家主修为自然增长（20%） */
  G.player.exp += Math.floor(expGain(G.player) * 5);
  /* 注：expGain 已经是 20% 版本，再 ×5 恢复到基本速度，也就是每年 20% */

  /* 4. 家族经济损失 / 收益 */
  processEconomy();

  /* 5. 族人寿命 + 修为 + 生死 */
  processMembersYearly();

  /* 6. 生育 */
  processBirth();

  /* 7. 灵兽老化 */
  processBeastsYearly();

  /* 8. 灵植生长 */
  processPlantsYearly();

  /* 9. 宗门事务 */
  if (G.isSect) {
    processSectYearly();
  }

  /* 10. NPC 势力动态 */
  updateNpcFamilies();

  /* 11. 妖兽潮 / 势力战争检测 */
  if (G.year >= (G.beastTideYear || 30)) {
    triggerBeastTide();
    return true;
  }
  if (G.year >= (G.nextWarYear || 999)) {
    triggerFactionWar();
    return true;
  }

  /* 12. 宗门晋升检查（家族有人达标时触发） */
  if (G.isSect) {
    const chk = canSectLevelUp();
    if (chk.can) {
      /* 弹窗询问是否晋升 */
      UI.decisionQueue.push({
        title: '🏛 宗门晋升',
        desc: `宗门已有资格晋升为【${chk.next.n}】。<br>${chk.next.desc}`,
        choices: [
          {
            text: '立时晋升！',
            risk: '稳',
            run: () => doSectLevelUp()
          },
          {
            text: '再缓几年',
            risk: '稳',
            run: () => { addLog('家主思虑再三，暂缓晋升。', 'event'); }
          }
        ]
      });
      showNextDecision();
      return true;
    }
  }

  /* 13. 宗门立派检测（家族出现元婴时触发） */
  if (!G.isSect && !G.promoted && hasNascentSoul()) {
    triggerSectPromotion();
    return true;
  }

  /* 14. 随机事件（1-3 个） */
  const events = rollYearEvents();
  if (events.length > 0) {
    /* 把事件加入队列，逐个处理 */
    events.forEach(e => UI.decisionQueue.push(e));
    showNextDecision();
    return true;
  }

  /* 若什么都没发生，写一条平静年 */
  if (G.log.length && G.log[G.log.length - 1].y !== G.year) {
    addLog(`第 ${G.year} 年，风平浪静。`, 'event');
  }

  return false;
}

/* =====================================================
 * 经济系统
 * ===================================================== */
function processEconomy() {
  const lv = {
    farm: G.buildings.farm || 0,
    market: G.buildings.market || 0,
    mine: G.buildings.mine || 0
  };
  const rule = getRule();
  const stoneMult = rule.eff.stone || 1;

  /* 收入 */
  const farmIncome = lv.farm * 12 * stoneMult;
  const marketIncome = lv.market * 20 * stoneMult;
  const mineIncome = lv.mine * 30 * stoneMult;

  /* 灵兽产出 */
  let beastStone = 0;
  let beastRep = 0;
  for (const b of G.beasts || []) {
    if (b.prod === 'stone') beastStone += b.pv;
    else if (b.prod === 'rep') beastRep += b.pv;
    else if (b.prod === 'all') {
      beastStone += b.pv;
      beastRep += Math.floor(b.pv / 10);
    }
  }

  G.stone += farmIncome + marketIncome + mineIncome + beastStone;

  /* 声望收入 */
  const hallRep = (G.buildings.hall || 0) * 3;
  G.reputation = Math.max(0, G.reputation + Math.floor(hallRep * (rule.eff.rep || 1)) + beastRep);

  /* 阵法维护费 */
  let upkeep = 0;
  for (const f of FORMATIONS) {
    const lvF = G.formO[f.id] || 0;
    upkeep += lvF * f.up;
  }
  G.stone = Math.max(0, G.stone - upkeep);

  /* 族人开销（每人每年 2 灵石）*/
  const baseCost = (G.family.length + 1) * 2;
  const costMult = rule.eff.cost || 1;
  G.stone = Math.max(0, G.stone - Math.floor(baseCost * costMult));
}

/* =====================================================
 * 族人年度结算
 * ===================================================== */
function processMembersYearly() {
  const snap = G.family.slice();
  const dead = [];

  for (const p of snap) {
    p.age++;

    /* 受伤 / 生病恢复倒计时 */
    if (p.health === 'injured' && p.injuredYears > 0) {
      p.injuredYears--;
      if (p.injuredYears <= 0) {
        p.health = null;
        p.injuredYears = 0;
      }
    }
    if (p.health === 'sick' && p.sickYears > 0) {
      p.sickYears--;
      if (p.sickYears <= 0) {
        p.health = null;
        p.sickYears = 0;
      }
    }

    /* 寿元检测 */
    if (p.age >= lifeMax(p)) {
      dead.push(p);
      continue;
    }

    /* 修为增长（受伤 / 生病时已由 expGain 处理） */
    p.exp += Math.floor(expGain(p) * 5);

    /* 突破判定 */
    const isMax = p.realm >= REALMS.length - 1 && p.sub >= SUBS.length - 1;
    if (!isMax && p.exp >= expNeed(p)) {
      const willRealm = p.sub === SUBS.length - 1 ? p.realm + 1 : p.realm;
      const needTrib = p.sub === SUBS.length - 1 && TRIBULATION_REALMS.includes(willRealm);

      if (needTrib) {
        /* NPC 渡劫 */
        startBigBreakthrough(p, false);
        if (p._dead) { dead.push(p); continue; }
      } else {
        const rate = breakRate(p) * 0.75;
        if (chance(rate)) {
          doSmallBreakthrough(p, false);
        } else {
          p.exp = Math.floor(expNeed(p) * 0.6);
        }
      }
    }

    /* 族人自主行为：小概率探险 / 拾遗 / 修炼奇遇 */
    if (chance(0.04)) {
      const r = Math.random();
      if (r < 0.5) {
        G.stone += rnd(20, 100);
      } else if (r < 0.85) {
        p.exp += Math.floor(expGain(p) * 5 * 3);
      } else {
        const art = rollArtifact(0.03);
        p.artifacts = p.artifacts || [];
        p.artifacts.push(art);
      }
    }
  }

  /* 处理死亡 */
  for (const p of dead) {
    addLog(`${p.name} 寿元耗尽，坐化而去。`, 'bad');
    G.history.push({ y: G.year, t: `${p.name}（${realmLabel(p)}）寿终。` });

    /* 元婴之上入墓园 */
    if (p.realm >= 4) {
      G.cemetery.push({
        n: p.name,
        realm: p.realm,
        age: p.age,
        gen: G.generation
      });
      G.cemeteryBonus = Math.min(30, Math.floor(
        G.cemetery.reduce((s, c) => s + c.realm, 0) * 0.5
      ));
      /* 底蕴奖励 */
      addLegacyPoints(p.realm * 2, `${p.name}（${REALMS[p.realm].n}）寿终`);
    }

    removeFamilyMember(p);
  }

  /* 更新宗门职位 */
  if (G.isSect) updateSectRanks();

  /* 更新本命法宝 */
  updateLifeBounds();
}

/* 从家族移除某个人 */
function removeFamilyMember(p) {
  G.family = G.family.filter(x => x.id !== p.id);
  G.family.forEach(x => {
    x.spouseIds = (x.spouseIds || []).filter(id => id !== p.id);
  });
  G.player.spouseIds = (G.player.spouseIds || []).filter(id => id !== p.id);
  /* 清除任务 */
  if (p.questActive) p.questActive = null;
}

/* =====================================================
 * 灵兽年度结算
 * ===================================================== */
function processBeastsYearly() {
  const deadBeasts = [];
  for (const b of G.beasts || []) {
    b.age++;
    if (b.age >= b.lifeMax) deadBeasts.push(b);
  }
  if (deadBeasts.length) {
    G.beasts = G.beasts.filter(b => !deadBeasts.includes(b));
    for (const b of deadBeasts) {
      addLog(`灵兽【${b.n}】寿终。`, 'event');
    }
  }
}

/* =====================================================
 * 灵植年度结算
 * ===================================================== */
function processPlantsYearly() {
  const mature = [];
  for (const p of G.plants || []) {
    p.grown++;
    const tmpl = PLANTS.find(x => x.id === p.tid);
    if (tmpl && p.grown >= tmpl.y) mature.push(p);
  }
  for (const p of mature) {
    const tmpl = PLANTS.find(x => x.id === p.tid);
    if (tmpl) {
      applyPlantEffect(tmpl);
      addLog(`✦ 灵植【${tmpl.n}】成熟，自动收取。`, 'good');
    }
    G.plants = G.plants.filter(x => x !== p);
  }
}

/* 应用灵植效果（自动收取时） */
function applyPlantEffect(tmpl) {
  const p = G.player;
  switch (tmpl.ef) {
    case 'exp':
      p.exp += tmpl.v;
      break;
    case 'br':
      p.pillBreakRealm = p.realm;
      p.curPillBreak = (p.curPillBreak || 0) + tmpl.v;
      break;
    case 'life':
      p.extraLife = (p.extraLife || 0) + tmpl.v;
      break;
    case 'power':
      p.powerBonus = (p.powerBonus || 0) + tmpl.v;
      break;
    case 'talent':
      p.talent = clamp(p.talent + tmpl.v, 0, 1);
      break;
    case 'rep':
      G.reputation += tmpl.v;
      break;
    case 'all':
      p.powerBonus = (p.powerBonus || 0) + tmpl.v;
      p.talent = clamp(p.talent + tmpl.v, 0, 1);
      p.extraLife = (p.extraLife || 0) + 50;
      break;
    case 'beast_power':
      for (const b of G.beasts || []) {
        b.p = Math.floor(b.p * (1 + tmpl.v));
      }
      break;
    case 'beast_evolve':
      /* 灵兽进化（简化处理） */
      for (const b of G.beasts || []) {
        if (b.t < 5) {
          b.t++;
          b.p = Math.floor(b.p * 2);
        }
      }
      break;
  }
}

/* =====================================================
 * 宗门年度结算
 * ===================================================== */
function processSectYearly() {
  /* 自动招人 */
  autoRecruitDisciples();

  /* 刷新宗门任务 */
  refreshSectQuests();

/* =====================================================
 * 检查是否有人达到元婴（触发宗门立派）
 * ===================================================== */
function hasNascentSoul() {
  if (G.player.realm >= 4) return true;
  return G.family.some(p => p.realm >= 4);
}

/* =====================================================
 * 触发宗门立派
 * ===================================================== */
function triggerSectPromotion() {
  G.promoted = true;
  UI.decisionQueue.push({
    title: '🏛 立宗机缘',
    desc: `
      <div class="mo-narrative">

        声望日隆，四方瞩目。<br>
        是否立下宗门，开宗立派，广收门徒？
      </div>
    `,

/* =====================================================
 * 妖兽潮（简化触发）
 * ===================================================== */
function triggerBeastTide() {
  const tp = Math.floor(500 * Math.pow(1.5, G.year / 100));
  const wall = (G.buildings.wall || 0) * 0.08;

  UI.decisionQueue.push({
    title: '🐺 妖兽潮来袭',
    desc: `
      <div class="mo-narrative">
        天地灵气暴动，妖兽自四方涌来。<br>
        强度：<b>${fmt(tp)}</b><br>
        家族战力：<b>${fmt(familyPower())}</b><br>
        城墙减伤：${(wall * 100).toFixed(0)}%
      </div>
    `,
    choices: [
      {
        text: '举族迎战',
        risk: '险',
        run: () => resolveBeastTide(tp, wall, false)
      },
      {
        text: '退守山门（战力 -50% 但伤亡减半）',
        risk: '中',
        run: () => resolveBeastTide(tp, wall, true)
      },
      {
        text: '雇散修助战（-500 灵石）',
        risk: '稳',
        run: () => {
          if (G.stone < 500) {
            addLog('灵石不足。', 'bad');
            resolveBeastTide(tp, wall, false);
            return;
          }
          G.stone -= 500;
          resolveBeastTide(tp, wall, 'hire');
        }
      }
    ],
    isTide: true
  });
  showNextDecision();
}

function resolveBeastTide(tp, wall, defMode) {
  const myPower = familyPower() *
    (defMode === true ? 0.5 : 1) *
    (1 + wall) *
    (defMode === 'hire' ? 1.3 : 1);

  const winRate = clamp(myPower / (myPower + tp), 0.15, 0.9);

  if (chance(winRate)) {
    /* 胜利 */
    const reward = Math.floor(tp * 0.3);
    G.stone += reward;
    G.reputation += 40;
    addLog(`✦ 家族击退妖兽潮！获得 ${fmt(reward)} 灵石，声望 +40。`, 'special');
  } else {
    /* 失败 */
    const loss = Math.floor(G.stone * 0.4);
    G.stone = Math.max(0, G.stone - loss);
    G.reputation = Math.max(0, G.reputation - 60);
    /* 随机牺牲 1-3 人 */
    const dead = [];
    for (let i = 0; i < rnd(1, 3) && G.family.length; i++) {
      const v = pick(G.family);
      dead.push(v.name);
      removeFamilyMember(v);
    }
    addLog(`✖ 家族败退，损失 ${fmt(loss)} 灵石，${dead.join('、')} 陨落。`, 'bad');
  }

  G.beastTideYear = G.year + rnd(25, 35);
  G.history.push({ y: G.year, t: `妖兽潮${chance(0.5) ? '被击退' : '家族溃败'}。` });
}

/* =====================================================
 * 势力战争（简化触发）

function triggerFactionWar() {

            G.reputation += 50;
            G.stone += rnd(1000, 3000);
            addLog('站队成功，家族得利。', 'good');
          } else {
            G.reputation = Math.max(0, G.reputation - 30);
            addLog('站队失败，家族声望受损。', 'bad');
          }
        }
      },
      {
        text: '保持中立',
        risk: '稳',
        run: () => { addLog('家主选择明哲保身。', 'event'); }
      }
    ],
    isWar: true
  });
  showNextDecision();
  G.nextWarYear = G.year + rnd(40, 70);
}

/* =====================================================
 * NPC 势力自然演变
 * ===================================================== */
function updateNpcFamilies() {
  for (const f of G.npcFamilies || []) {
    if (!f.alive) continue;
    /* 势力微涨微落 */
    f.power = Math.max(50, f.power + rnd(-3, 4) * 30);
    /* 关系微变 */
    if (chance(0.1)) {
      f.rel = clamp((f.rel || 0) + rnd(-3, 3), -100, 100);
    }
    /* 极小概率覆灭 */
    if (chance(0.002)) {
      f.alive = false;
      addLog(`📢 天下传讯：${f.n} 覆灭。`, 'event');
    }
  }

  /* 极小概率新势力崛起 */
  if (chance(0.003) && (G.npcFamilies || []).filter(f => f.alive).length < 10) {
    const name = pick(NPC_NAMES);
    if (!G.npcFamilies.some(f => f.n === name && f.alive)) {
      G.npcFamilies.push({
        id: G.nextId++,
        n: name,
        type: pick(NPC_TYPES),
        power: rnd(500, 5000),
        rel: rnd(-20, 30),
        alive: true
      });
      addLog(`📢 天下新势力【${name}】崛起。`, 'event');
    }
  }
}

<script>
/* =====================================================
 * 六十六、家主继任
 * ===================================================== */

function handlePlayerDeath() {
  const dead = G.player;
  addLog(`【家主陨落】${dead.name} 寿元耗尽，坐化而去。`, 'bad');
  G.history.push({
    y: G.year,
    t: `第 ${G.generation} 代家主 ${dead.name} 寿终 ${dead.age} 岁。`
  });

  /* 入墓园 */
  if (dead.realm >= 4) {
    G.cemetery.push({
      n: dead.name,
      realm: dead.realm,
      age: dead.age,
      gen: G.generation
    });
    G.cemeteryBonus = Math.min(30, Math.floor(
      G.cemetery.reduce((s, c) => s + c.realm, 0) * 0.5
    ));
  }

  /* 底蕴奖励 */
  const award = dead.realm * 4 + G.generation * 3 + Math.floor(G.reputation / 1000);
  addLegacyPoints(Math.max(5, award), `家主 ${dead.name} 功德`);

  /* 家族无人：游戏结束 */
  if (!G.family.length) {
    gameOver('家主陨落，家族无人继任，传承断绝。');
    return;
  }

  /* 候选人 */
  const cands = G.family
    .filter(p => p.age >= 16)
    .sort((a, b) => {
      const la = a.realm * 3 + a.sub;
      const lb = b.realm * 3 + b.sub;
      return lb - la || b.talent - a.talent;
    });

  if (!cands.length) {
    /* 无成年族人，取年最长者 */
    const fb = G.family.slice().sort((a, b) => b.age - a.age);
    if (fb.length) cands.push(fb[0]);
    else {
      gameOver('家族后继无人。');
      return;
    }
  }

  const top = cands.slice(0, 5);

  /* 弹窗选择继承人 */
  UI.decisionQueue.push({
    title: '👑 家主继任',
    desc: `
      <div class="mo-narrative">
        ${dead.name} 坐化而去。<br>
        族中长老聚于祠堂，共议新任家主——<br>
        家族兴衰，尽在你一念之间。
      </div>
    `,
    choices: top.map(c => ({
      text: `立 ${c.name}（${realmLabel(c)}·天赋${c.talent.toFixed(2)}·${c.age}岁）`,
      risk: '稳',
      run: () => becomeHead(c, dead)
    })).concat([
      {
        text: '让长老们自行推举（随机）',
        risk: '中',
        run: () => becomeHead(pick(top), dead)
      }
    ])
  });
  UI.modalOpen = true;
  showNextDecision();
}

/* 某人继位为新家主 */
function becomeHead(person, prev) {
  /* 从家族移除 */
  G.family = G.family.filter(p => p.id !== person.id);

  /* 继承一半法宝 */
  const inheritArts = (prev.artifacts || []).filter(() => chance(0.5));
  person.artifacts = (person.artifacts || []).concat(inheritArts);

  /* 继承部分功法 */
  for (const tid of (prev.techniques || [])) {
    if ((person.techniques || []).length >= 3) break;
    if (!person.techniques.includes(tid)) {
      person.techniques = person.techniques || [];
      person.techniques.push(tid);
    }
  }

  /* 声望折半 */
  G.reputation = Math.floor(G.reputation * 0.5) + 30;

  /* 继承人成为新的玩家 */
  const oldName = prev.name;
  person.isPlayer = true;
  person.isSectMember = false;
  person.sectRank = null;
  person.questActive = null;
  G.player = person;
  G.playerId = person.id;
  G.generation++;

  addLog(`✦✦ 第 ${G.generation} 代家主 ${person.name} 继位，承继家业。`, 'special');
  G.history.push({
    y: G.year,
    t: `第 ${G.generation} 代家主 ${person.name} 继位（承自 ${oldName}）。`
  });
}

/* =====================================================
 * 六十七、游戏结束
 * ===================================================== */

function gameOver(reason) {
  if (G.over) return;
  G.over = true;

  addLog('【剧终】' + reason, 'bad');
  G.history.push({ y: G.year, t: reason });

  /* 底蕴计算 */
  const peak = Math.max(
    G.player.realm,
    ...G.family.map(p => p.realm),
    ...G.cemetery.map(c => c.realm),
    0
  );
  const total = peak * 5
    + G.generation * 10
    + Math.floor(G.reputation / 500)
    + (G.cities ? G.cities.length * 20 : 0);
  addLegacyPoints(total, '家族覆灭终局');

  UI.decisionQueue.push({
    title: '⛔ 家族终局',
    desc: `
      <div class="mo-narrative">
        ${reason}<br><br>
        传至第 ${G.generation} 代，历时 ${G.year} 年。<br>
        家族最高修为：${REALMS[peak].n}<br>
        最终声望：${fmt(G.reputation)}
      </div>
      <div style="text-align:center;margin-top:12px;color:#b83a30;font-size:15px">
        本次获得底蕴：<b>${total}</b> 点
      </div>
    `,
    choices: [
      {
        text: '重新开局（保留底蕴）',
        run: () => resetGame()
      },
      {
        text: '查看底蕴（返回主界面）',
        run: () => {
          UI.modalOpen = false;
          document.getElementById('modal').classList.remove('show');
          UI.tab = 'legacy';
          UI.sub = 'legacy';
          render();
        }
      }
    ]
  });
  showNextDecision();
}

/* =====================================================
 * 六十八、存档系统（3 个存档位 + 导出）
 * ===================================================== */

/* 存档位选择 */
let CURRENT_SLOT = 1;

/* 保存到指定槽位 */
function saveToSlot(slot) {
  try {
    const key = STORAGE_KEY + '_slot' + slot;
    const data = JSON.stringify(G);
    localStorage.setItem(key, data);
    localStorage.setItem(key + '_time', String(Date.now()));
    addLog(`✅ 已保存到存档位 ${slot}。`, 'good');
    return true;
  } catch (e) {
    addLog('❌ 存档失败：' + e.message, 'bad');
    return false;
  }
}

/* 从指定槽位读取 */
function loadFromSlot(slot) {
  try {
    const key = STORAGE_KEY + '_slot' + slot;
    const str = localStorage.getItem(key);
    if (!str) {
      addLog(`❌ 存档位 ${slot} 为空。`, 'bad');
      return false;
    }
    const data = JSON.parse(str);
    if (!data || !data.player) throw new Error('存档格式错误');

    /* 恢复全局状态 */
    G = data;

    /* 补全可能缺失的字段 */
    const defaults = {
      log: [], family: [], secretRealms: [], factions: [],
      npcFamilies: [], techniqueIds: [], history: [],
      pills: {}, pillRecipes: ['hy', 'zj'],
      beasts: [], plants: [], formO: {},
      cemetery: [], titles: [], sectQuests: [],
      beastTideYear: 30, nextWarYear: 60,
      tribulationGear: 0, promoted: false
    };
    for (const k in defaults) {
      if (G[k] == null) G[k] = defaults[k];
    }
    G.buildings = Object.assign(
      Object.fromEntries(Object.keys(BLD).map(k => [k, 0])),
      G.buildings || {}
    );
    G.mainQuests = G.mainQuests || MAIN_QUESTS.map(q => ({ ...q, done: false }));

    /* 补全 nextId */
    let maxId = G.player.id;
    G.family.forEach(p => { if (p.id > maxId) maxId = p.id; });
    G.nextId = Math.max(G.nextId || 0, maxId + 1);

    UI.selectedAction = null;
    UI.modalOpen = false;

    addLog(`✅ 已从存档位 ${slot} 读取。`, 'good');
    return true;
  } catch (e) {
    addLog('❌ 读档失败：' + e.message, 'bad');
    return false;
  }
}

/* 快速存（使用当前槽位）*/
function quickSave() {
  return saveToSlot(CURRENT_SLOT);
}

/* 快速读（使用当前槽位）*/
function quickLoad() {
  return loadFromSlot(CURRENT_SLOT);
}

/* 获取存档位信息（供 UI 显示） */
function getSlotInfo(slot) {
  try {
    const key = STORAGE_KEY + '_slot' + slot;
    const str = localStorage.getItem(key);
    if (!str) return null;
    const data = JSON.parse(str);
    const timeStr = localStorage.getItem(key + '_time');
    return {
      year: data.year || 0,
      generation: data.generation || 1,
      familyName: data.player && data.player.name ? data.player.name[0] + '氏' : '未知',
      time: timeStr ? new Date(+timeStr) : null
    };
  } catch (e) {
    return null;
  }
}

/* 删除某个槽位 */
function deleteSlot(slot) {
  try {
    const key = STORAGE_KEY + '_slot' + slot;
    localStorage.removeItem(key);
    localStorage.removeItem(key + '_time');
    return true;
  } catch (e) {
    return false;
  }
}

/* ---------------------------------------------
 * 存档导出（变成一段文字，可复制粘贴）
 * --------------------------------------------- */
function exportSave() {
  try {
    const data = JSON.stringify(G);
    /* 简单压缩：base64 */
    const encoded = btoa(encodeURIComponent(data));
    return encoded;
  } catch (e) {
    addLog('❌ 导出失败：' + e.message, 'bad');
    return null;
  }
}

function importSave(str) {
  try {
    const data = JSON.parse(decodeURIComponent(atob(str)));
    if (!data || !data.player) throw new Error('存档格式错误');
    G = data;
    const defaults = {
      log: [], family: [], secretRealms: [], factions: [],
      npcFamilies: [], techniqueIds: [], history: [],
      pills: {}, pillRecipes: ['hy'], beasts: [], plants: [],
      formO: {}, cemetery: [], titles: [], sectQuests: []
    };
    for (const k in defaults) {
      if (G[k] == null) G[k] = defaults[k];
    }
    G.buildings = Object.assign(
      Object.fromEntries(Object.keys(BLD).map(k => [k, 0])),
      G.buildings || {}
    );
    G.mainQuests = G.mainQuests || MAIN_QUESTS.map(q => ({ ...q, done: false }));
    addLog('✅ 存档导入成功！', 'good');
    return true;
  } catch (e) {
    addLog('❌ 导入失败：' + e.message, 'bad');
    return false;
  }
}

/* =====================================================
 * 六十九、底蕴系统（跨局继承）
 * ===================================================== */

function loadLegacy() {
  try {
    const s = localStorage.getItem(LEGACY_KEY);
    if (s) LEGACY = JSON.parse(s);
    if (!LEGACY.upgrades) LEGACY.upgrades = {};
    if (!LEGACY.points) LEGACY.points = 0;
  } catch (e) {
    LEGACY = { points: 0, upgrades: {} };
  }
}

function saveLegacy() {
  try {
    localStorage.setItem(LEGACY_KEY, JSON.stringify(LEGACY));
  } catch (e) {
    /* 忽略 */
  }
}

function addLegacyPoints(n, reason) {
  if (n <= 0) return;
  LEGACY.points += n;
  saveLegacy();
  addLog(`✦ 获得底蕴 +${n}（${reason}）`, 'special');
}

function buyLegacyUpgrade(id) {
  const up = LEGACY_UPGRADES.find(u => u.id === id);
  if (!up) return;

  const cur = LEGACY.upgrades[id] || 0;
  if (cur >= up.max) {
    addLog('已达上限。', 'bad');
    return;
  }

  const cost = up.cost * (cur + 1);
  if (LEGACY.points < cost) {
    addLog(`底蕴不足（需 ${cost}）。`, 'bad');
    return;
  }

  LEGACY.points -= cost;
  LEGACY.upgrades[id] = cur + 1;
  saveLegacy();
  addLog(`✦ 底蕴升级【${up.n}】至 ${cur + 1} 级。`, 'special');
  render();
}

/* =====================================================
 * 七十、新游戏 / 重置
 * ===================================================== */

function resetGame() {
  /* 关闭所有弹窗 */
  document.getElementById('modal').classList.remove('show');
  UI.modalOpen = false;
  UI.decisionQueue = [];
  UI.selectedAction = null;
  UI.selectedYears = 5;

  /* 显示创建角色界面 */
  showCharacterCreator();
}

/* 删除旧的所有存档位（用户主动重置时） */
function clearAllSaves() {
  for (let i = 1; i <= 3; i++) {
    deleteSlot(i);
  }
}

  mountAllIcons();
